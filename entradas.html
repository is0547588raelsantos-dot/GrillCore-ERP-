<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Entradas - GrillCore ERP</title>

<link rel="stylesheet" href="style.css">

<style>

body {
    background: #181818;
    color: white;
    font-family: Arial, sans-serif;
    padding: 15px;
}

h1,
h2 {
    color: #ff7a00;
}

.card {
    background: #242424;
    padding: 20px;
    margin: 15px 0;
    border-radius: 15px;
}

input,
select {
    width: 100%;
    box-sizing: border-box;
    padding: 15px;
    margin: 8px 0;
    border: none;
    border-radius: 10px;
    font-size: 18px;
}

button {
    width: 100%;
    padding: 18px;
    margin: 8px 0;
    border: none;
    border-radius: 12px;
    background: #ff7a00;
    color: white;
    font-size: 20px;
    font-weight: bold;
}

.entrada {
    background: #242424;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 18px;
    margin: 12px 0;
}

.valor {
    color: #ff7a00;
    font-size: 25px;
    font-weight: bold;
}

.excluir {
    background: #b3261e;
}

</style>

</head>

<body>

<h1>📈 Entradas</h1>

<p>Cadastro de entradas financeiras</p>

<hr>


<!-- ================================= -->
<!-- CADASTRAR ENTRADA -->
<!-- ================================= -->

<h2>➕ Nova Entrada</h2>

<div class="card">

<label>Descrição</label>

<input
    type="text"
    id="descricao"
    placeholder="Ex: Venda de bebida, investimento..."
>


<label>Valor</label>

<input
    type="number"
    id="valor"
    placeholder="0,00"
    step="0.01"
>


<label>Forma de recebimento</label>

<select id="formaPagamento">

    <option value="Dinheiro">
        💵 Dinheiro
    </option>

    <option value="Pix">
        📱 Pix
    </option>

    <option value="Cartão">
        💳 Cartão
    </option>

</select>


<button onclick="cadastrarEntrada()">

    ➕ Cadastrar Entrada

</button>

</div>


<hr>


<!-- ================================= -->
<!-- RESUMO -->
<!-- ================================= -->

<h2>💰 Total de Entradas</h2>

<div class="card">

<div
    id="total"
    class="valor">

R$ 0,00

</div>

</div>


<hr>


<!-- ================================= -->
<!-- HISTÓRICO -->
<!-- ================================= -->

<h2>📋 Histórico de Entradas</h2>

<div id="listaEntradas">

Carregando...

</div>


<hr>


<button
    onclick="window.location.href='financeiro.html'">

    💰 Voltar ao Financeiro

</button>


<button
    onclick="window.location.href='index.html'">

    🏠 Voltar ao Início

</button>


<script>

// =====================================
// 💾 BANCO DE ENTRADAS
// =====================================

let entradas =
    JSON.parse(
        localStorage.getItem("entradas")
    ) || [];


// =====================================
// 💰 FORMATAR DINHEIRO
// =====================================

function dinheiro(valor) {

    return "R$ " +
        Number(valor || 0)
        .toFixed(2)
        .replace(".", ",");

}


// =====================================
// ➕ CADASTRAR ENTRADA
// =====================================

function cadastrarEntrada() {

    let descricao =
        document
        .getElementById("descricao")
        .value
        .trim();


    let valor =
        Number(
            document
            .getElementById("valor")
            .value
        );


    let formaPagamento =
        document
        .getElementById("formaPagamento")
        .value;


    // =================================
    // VALIDAÇÃO
    // =================================

    if (descricao === "") {

        alert(
            "⚠️ Digite uma descrição."
        );

        return;

    }


    if (
        isNaN(valor) ||
        valor <= 0
    ) {

        alert(
            "⚠️ Digite um valor válido."
        );

        return;

    }


    // =================================
    // SALVAR
    // =================================

    entradas.push({

        id:
            Date.now(),

        data:
            new Date().toISOString(),

        descricao:
            descricao,

        valor:
            valor,

        pagamento:
            formaPagamento

    });


    localStorage.setItem(
        "entradas",
        JSON.stringify(entradas)
    );


    // =================================
    // LIMPAR
    // =================================

    document
    .getElementById("descricao")
    .value = "";


    document
    .getElementById("valor")
    .value = "";


    // =================================
    // ATUALIZAR
    // =================================

    mostrarEntradas();


    alert(
        "✅ Entrada cadastrada!\n\n" +
        descricao +
        "\n" +
        dinheiro(valor)
    );

}


// =====================================
// 📋 MOSTRAR ENTRADAS
// =====================================

function mostrarEntradas() {

    let lista =
        document.getElementById(
            "listaEntradas"
        );


    let total = 0;


    if (entradas.length === 0) {

        lista.innerHTML =
            "<p>📭 Nenhuma entrada cadastrada.</p>";

        document.getElementById(
            "total"
        ).innerText =
            "R$ 0,00";

        return;

    }


    lista.innerHTML = "";


    entradas
    .slice()
    .reverse()
    .forEach(function(
        entrada
    ) {

        total +=
            Number(entrada.valor) || 0;


        let data =
            entrada.data
            ? new Date(
                entrada.data
              ).toLocaleString(
                "pt-BR"
              )
            : "-";


        lista.innerHTML += `

        <div class="entrada">

            <h3>
                💰 ${entrada.descricao}
            </h3>

            <p>
                📅 <strong>Data:</strong>
                ${data}
            </p>

            <p>
                💳 <strong>Pagamento:</strong>
                ${entrada.pagamento || "-"}
            </p>

            <p class="valor">

                ${dinheiro(entrada.valor)}

            </p>

            <button
                class="excluir"
                onclick="excluirEntrada(${entrada.id})">

                🗑️ Excluir Entrada

            </button>

        </div>

        `;

    });


    document.getElementById(
        "total"
    ).innerText =
        dinheiro(total);

}


// =====================================
// 🗑️ EXCLUIR ENTRADA
// =====================================

function excluirEntrada(id) {

    let confirmar =
        confirm(
            "Deseja realmente excluir esta entrada?"
        );


    if (!confirmar) {
        return;
    }


    entradas =
        entradas.filter(
            function(entrada) {

                return entrada.id !== id;

            }
        );


    localStorage.setItem(
        "entradas",
        JSON.stringify(entradas)
    );


    mostrarEntradas();


    alert(
        "🗑️ Entrada excluída."
    );

}


// =====================================
// 🚀 INICIAR
// =====================================

window.addEventListener(
    "load",
    function() {

        mostrarEntradas();

    }
);

</script>

</body>

</html>
