<html lang="pt-BR">

<head>

if(localStorage.getItem("grillcore_login") !== "true"){
    window.location.replace("login.html");
}
</script>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#ff7300">

<meta name="description"
      content="Gestão de clientes — GrillCore ERP">

<title>Clientes — GrillCore ERP</title>

<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   BASE
===================================================== */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            180deg,
            #0b0b0b,
            #151515
        );

    color:#fff;
}

/* =====================================================
   CONTAINER
===================================================== */

.container{
    width:100%;
    max-width:1100px;

    margin:0 auto;

    padding:
        16px
        14px
        40px;
}

/* =====================================================
   TOPO
===================================================== */

.topo{
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:12px;

    margin-bottom:18px;

    padding:16px;

    background:#111;

    border:
        1px solid
        #292929;

    border-radius:18px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.35);
}

.btn-voltar{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    min-height:42px;

    padding:
        0 14px;

    border-radius:12px;

    background:#222;

    color:#fff;

    text-decoration:none;

    font-weight:800;

    border:
        1px solid
        #333;
}

.btn-voltar:active{
    transform:scale(.97);
}

.topo-centro{
    text-align:center;

    flex:1;
}

.topo h1{
    margin:0;

    font-size:
        clamp(22px,5vw,34px);

    font-weight:900;

    letter-spacing:.5px;
}

.topo h1 span{
    color:#ff7300;
}

.subtitulo{
    margin-top:5px;

    color:#aaa;

    font-size:13px;
}

.status{
    display:flex;

    align-items:center;

    gap:7px;

    padding:
        9px 12px;

    border-radius:999px;

    background:#171717;

    color:#ddd;

    font-size:12px;

    font-weight:700;

    white-space:nowrap;
}

.status-ponto{
    width:9px;
    height:9px;

    border-radius:50%;

    background:#28c76f;

    box-shadow:
        0 0 8px
        rgba(40,199,111,.7);
}

/* =====================================================
   CARDS
===================================================== */

.card{
    background:#111;

    border:
        1px solid
        #292929;

    border-radius:18px;

    padding:18px;

    margin-bottom:16px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.28);
}

.titulo-secao{
    margin:
        0 0 16px;

    font-size:19px;

    font-weight:900;
}

.titulo-secao span{
    color:#ff7300;
}

/* =====================================================
   FORMULÁRIO
===================================================== */

.form-grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:14px;
}

.campo{
    display:flex;

    flex-direction:column;

    gap:7px;
}

.campo-full{
    grid-column:
        1 / -1;
}

label{
    color:#ddd;

    font-size:13px;

    font-weight:800;
}

input,
textarea{
    width:100%;

    border:
        1px solid
        #353535;

    background:#080808;

    color:#fff;

    border-radius:12px;

    padding:
        13px;

    outline:none;

    font-size:15px;
}

input:focus,
textarea:focus{
    border-color:#ff7300;

    box-shadow:
        0 0 0 2px
        rgba(255,115,0,.12);
}

textarea{
    min-height:95px;

    resize:vertical;
}

/* =====================================================
   BOTÕES
===================================================== */

.acoes{
    display:flex;

    flex-wrap:wrap;

    gap:10px;

    margin-top:16px;
}

.btn{
    min-height:46px;

    border:0;

    border-radius:12px;

    padding:
        0 18px;

    font-weight:900;

    cursor:pointer;

    font-size:14px;
}

.btn-salvar{
    background:#ff7300;

    color:#fff;

    flex:1;
}

.btn-salvar:hover{
    background:#ff861f;
}

.btn-cancelar{
    background:#292929;

    color:#fff;

    display:none;
}

.btn-cancelar.mostrar{
    display:block;
}

/* =====================================================
   PESQUISA
===================================================== */

.pesquisa-box{
    margin-bottom:16px;
}

.pesquisa{
    position:relative;
}

.pesquisa input{
    padding-left:42px;
}

.icone-pesquisa{
    position:absolute;

    left:14px;
    top:50%;

    transform:
        translateY(-50%);

    font-size:17px;

    color:#888;

    pointer-events:none;
}

/* =====================================================
   CABEÇALHO LISTA
===================================================== */

.lista-topo{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-bottom:12px;
}

.contador{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    min-width:34px;
    height:30px;

    padding:
        0 10px;

    border-radius:999px;

    background:#ff7300;

    color:#fff;

    font-size:13px;

    font-weight:900;
}

/* =====================================================
   CLIENTE
===================================================== */

.lista-clientes{
    display:flex;

    flex-direction:column;

    gap:10px;
}

.cliente{
    background:#181818;

    border:
        1px solid
        #2d2d2d;

    border-radius:15px;

    padding:15px;

    transition:.2s;
}

.cliente:hover{
    border-color:
        rgba(255,115,0,.55);
}

.cliente-topo{
    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:10px;
}

.cliente-nome{
    font-size:17px;

    font-weight:900;

    color:#fff;

    word-break:break-word;
}

.cliente-data{
    color:#777;

    font-size:11px;

    white-space:nowrap;
}

.cliente-info{
    display:flex;

    flex-direction:column;

    gap:6px;

    margin-top:10px;

    color:#ccc;

    font-size:13px;

    line-height:1.4;
}

.cliente-info strong{
    color:#fff;
}

.cliente-observacoes{
    margin-top:9px;

    padding:
        9px 10px;

    border-left:
        3px solid
        #ff7300;

    background:#101010;

    border-radius:
        0 8px 8px 0;

    color:#bbb;

    font-size:12px;

    line-height:1.45;

    white-space:pre-wrap;

    word-break:break-word;
}

.cliente-acoes{
    display:flex;

    gap:8px;

    margin-top:13px;
}

.btn-editar,
.btn-excluir{
    min-height:38px;

    padding:
        0 13px;

    border-radius:10px;

    border:0;

    font-weight:800;

    cursor:pointer;
}

.btn-editar{
    background:#292929;

    color:#fff;
}

.btn-excluir{
    background:#3a1717;

    color:#ff8585;
}

.btn-editar:active,
.btn-excluir:active{
    transform:scale(.97);
}

/* =====================================================
   VAZIO / CARREGANDO
===================================================== */

.estado{
    padding:28px 15px;

    text-align:center;

    color:#888;

    font-size:14px;

    background:#0d0d0d;

    border:
        1px dashed
        #333;

    border-radius:14px;
}

.estado strong{
    display:block;

    margin-bottom:5px;

    color:#ddd;

    font-size:16px;
}

/* =====================================================
   MENSAGEM
===================================================== */

.mensagem{
    min-height:20px;

    margin-top:12px;

    font-size:13px;

    font-weight:800;

    text-align:center;
}

.mensagem.sucesso{
    color:#4ade80;
}

.mensagem.erro{
    color:#ff6b6b;
}

.mensagem.info{
    color:#ffb36b;
}

/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:700px){

    .container{
        padding:
            10px
            10px
            30px;
    }

    .topo{
        padding:12px;

        border-radius:15px;
    }

    .topo h1{
        font-size:21px;
    }

    .subtitulo{
        display:none;
    }

    .status{
        font-size:10px;

        padding:
            7px 9px;
    }

    .status-ponto{
        width:7px;
        height:7px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .campo-full{
        grid-column:auto;
    }

    .card{
        padding:14px;

        border-radius:15px;
    }

    .cliente-topo{
        flex-direction:column;
    }

    .cliente-data{
        white-space:normal;
    }

}

@media(max-width:430px){

    .btn-voltar{
        padding:
            0 10px;

        font-size:12px;
    }

    .topo{
        gap:7px;
    }

    .topo-centro{
        min-width:0;
    }

    .topo h1{
        font-size:18px;
    }

    .status{
        display:none;
    }

    .acoes{
        flex-direction:column;
    }

    .btn-salvar,
    .btn-cancelar{
        width:100%;
    }

    .cliente-acoes{
        flex-direction:column;
    }

    .btn-editar,
    .btn-excluir{
        width:100%;
    }

}

</style>

</head>

<body>

<div class="container">

<!-- =====================================================
     TOPO
===================================================== -->

<header class="topo">

    <a
        href="index.html"
        class="btn-voltar"
    >
        ← Voltar
    </a>

    <div class="topo-centro">

        <h1>
            CLIENT<span>ES</span>
        </h1>

        <div class="subtitulo">
            Cadastro e gerenciamento de clientes
        </div>

    </div>

    <div class="status">

        <span class="status-ponto"></span>

        Supabase

    </div>

</header>


<!-- =====================================================
     CADASTRO
===================================================== -->

<section class="card">

    <h2 class="titulo-secao">
        👤 <span>Novo cliente</span>
    </h2>

    <div class="form-grid">

        <div class="campo">

            <label for="nomeCliente">
                Nome do cliente
            </label>

            <input
                type="text"
                id="nomeCliente"
                placeholder="Digite o nome"
                autocomplete="off"
            >

        </div>


        <div class="campo">

            <label for="telefoneCliente">
                Telefone / WhatsApp
            </label>

            <input
                type="tel"
                id="telefoneCliente"
                placeholder="(00) 00000-0000"
                autocomplete="off"
            >

        </div>


        <div class="campo campo-full">

            <label for="enderecoCliente">
                Endereço
            </label>

            <input
                type="text"
                id="enderecoCliente"
                placeholder="Rua, número, bairro..."
                autocomplete="off"
            >

        </div>


        <div class="campo campo-full">

            <label for="observacoesCliente">
                Observações
            </label>

            <textarea
                id="observacoesCliente"
                placeholder="Observações sobre o cliente..."
            ></textarea>

        </div>

    </div>


    <div class="acoes">

        <button
            type="button"
            class="btn btn-salvar"
            id="btnSalvar"
        >
            💾 SALVAR CLIENTE
        </button>

        <button
            type="button"
            class="btn btn-cancelar"
            id="btnCancelar"
        >
            ✕ CANCELAR EDIÇÃO
        </button>

    </div>


    <div
        id="mensagem"
        class="mensagem"
    ></div>

</section>


<!-- =====================================================
     LISTA
===================================================== -->

<section class="card">

    <div class="lista-topo">

        <h2 class="titulo-secao">
            📋 Clientes cadastrados
        </h2>

        <span
            class="contador"
            id="contadorClientes"
        >
            0
        </span>

    </div>


    <div class="pesquisa-box">

        <div class="pesquisa">

            <span class="icone-pesquisa">
                🔎
            </span>

            <input
                type="search"
                id="pesquisaCliente"
                placeholder="Pesquisar por nome, telefone ou endereço..."
                autocomplete="off"
            >

        </div>

    </div>


    <div
        id="listaClientes"
        class="lista-clientes"
    >

        <div class="estado">

            <strong>
                Carregando clientes...
            </strong>

            Aguarde um momento.

        </div>

    </div>

</section>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

"use strict";

const SUPABASE_URL =
    "https://vtdfdqtjcyqbtfskwnun.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_HZB_Bu780JSCXWLzb7pRoA_aKNwmfls";

const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =====================================================
   ESTADO
===================================================== */

let clientes = [];

let clienteEditandoId = null;


/* =====================================================
   ELEMENTOS
===================================================== */

const nomeCliente =
    document.getElementById(
        "nomeCliente"
    );

const telefoneCliente =
    document.getElementById(
        "telefoneCliente"
    );

const enderecoCliente =
    document.getElementById(
        "enderecoCliente"
    );

const observacoesCliente =
    document.getElementById(
        "observacoesCliente"
    );

const btnSalvar =
    document.getElementById(
        "btnSalvar"
    );

const btnCancelar =
    document.getElementById(
        "btnCancelar"
    );

const mensagem =
    document.getElementById(
        "mensagem"
    );

const listaClientes =
    document.getElementById(
        "listaClientes"
    );

const contadorClientes =
    document.getElementById(
        "contadorClientes"
    );

const pesquisaCliente =
    document.getElementById(
        "pesquisaCliente"
    );


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
    texto,
    tipo = "info"
){

    mensagem.textContent =
        texto;

    mensagem.className =
        "mensagem " + tipo;

    clearTimeout(
        mostrarMensagem.timer
    );

    mostrarMensagem.timer =
        setTimeout(
            function(){

                mensagem.textContent =
                    "";

                mensagem.className =
                    "mensagem";

            },
            4000
        );
}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapar(valor){

    return String(
        valor ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   DATA
===================================================== */

function formatarData(data){

    if(!data){

        return "-";

    }

    const dataObj =
        new Date(data);

    if(
        Number.isNaN(
            dataObj.getTime()
        )
    ){

        return "-";

    }

    return dataObj.toLocaleDateString(
        "pt-BR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );

}


/* =====================================================
   CARREGAR CLIENTES
===================================================== */

async function carregarClientes(){

    listaClientes.innerHTML = `

        <div class="estado">

            <strong>
                Carregando clientes...
            </strong>

            Aguarde.

        </div>

    `;

    try{

        const resposta =
            await supabase
                .from("clientes")
                .select(
                    "id,created_at,nome,telefone,endereco,observacoes"
                )
                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                );


        if(resposta.error){

            console.error(
                resposta.error
            );

            throw resposta.error;

        }


        clientes =
            Array.isArray(
                resposta.data
            )
                ?
                resposta.data
                :
                [];


        renderizarClientes();


    }catch(erro){

        console.error(
            "Erro ao carregar clientes:",
            erro
        );

        listaClientes.innerHTML = `

            <div class="estado">

                <strong>
                    ⚠️ Não foi possível carregar os clientes.
                </strong>

                Verifique a conexão com o Supabase e as políticas RLS da tabela <b>clientes</b>.

            </div>

        `;

        mostrarMensagem(
            "Erro ao carregar clientes.",
            "erro"
        );

    }

}


/* =====================================================
   RENDERIZAR
===================================================== */

function renderizarClientes(){

    const pesquisa =
        String(
            pesquisaCliente.value || ""
        )
        .trim()
        .toLowerCase();


    const filtrados =
        clientes.filter(
            function(cliente){

                if(!pesquisa){

                    return true;

                }

                const texto =
                    [
                        cliente.nome,
                        cliente.telefone,
                        cliente.endereco,
                        cliente.observacoes
                    ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();

                return texto.includes(
                    pesquisa
                );

            }
        );


    contadorClientes.textContent =
        filtrados.length;


    if(filtrados.length === 0){

        listaClientes.innerHTML = `

            <div class="estado">

                <strong>
                    Nenhum cliente encontrado.
                </strong>

                Cadastre um cliente acima ou altere a pesquisa.

            </div>

        `;

        return;

    }


    listaClientes.innerHTML =
        filtrados
            .map(
                function(cliente){

                    return `

                        <article
                            class="cliente"
                        >

                            <div
                                class="cliente-topo"
                            >

                                <div
                                    class="cliente-nome"
                                >
                                    👤
                                    ${escapar(
                                        cliente.nome
                                        ||
                                        "Cliente sem nome"
                                    )}
                                </div>

                                <div
                                    class="cliente-data"
                                >
                                    Cadastro:
                                    ${formatarData(
                                        cliente.created_at
                                    )}
                                </div>

                            </div>


                            <div
                                class="cliente-info"
                            >

                                ${
                                    cliente.telefone
                                    ?
                                    `
                                    <div>
                                        📱
                                        <strong>Telefone:</strong>
                                        ${escapar(
                                            cliente.telefone
                                        )}
                                    </div>
                                    `
                                    :
                                    ""
                                }


                                ${
                                    cliente.endereco
                                    ?
                                    `
                                    <div>
                                        🏠
                                        <strong>Endereço:</strong>
                                        ${escapar(
                                            cliente.endereco
                                        )}
                                    </div>
                                    `
                                    :
                                    ""
                                }

                            </div>


                            ${
                                cliente.observacoes
                                ?
                                `
                                <div
                                    class="cliente-observacoes"
                                >
                                    <strong>
                                        📝 Observações
                                    </strong>

                                    <br>

                                    ${escapar(
                                        cliente.observacoes
                                    )}
                                </div>
                                `
                                :
                                ""
                            }


                            <div
                                class="cliente-acoes"
                            >

                                <button
                                    type="button"
                                    class="btn-editar"
                                    onclick="editarCliente('${escapar(cliente.id)}')"
                                >
                                    ✏️ EDITAR
                                </button>


                                <button
                                    type="button"
                                    class="btn-excluir"
                                    onclick="excluirCliente('${escapar(cliente.id)}')"
                                >
                                    🗑️ EXCLUIR
                                </button>

                            </div>

                        </article>

                    `;

                }
            )
            .join("");

}


/* =====================================================
   LIMPAR FORMULÁRIO
===================================================== */

function limparFormulario(){

    nomeCliente.value =
        "";

    telefoneCliente.value =
        "";

    enderecoCliente.value =
        "";

    observacoesCliente.value =
        "";

    clienteEditandoId =
        null;

    btnSalvar.textContent =
        "💾 SALVAR CLIENTE";

    btnCancelar.classList.remove(
        "mostrar"
    );

}


/* =====================================================
   EDITAR CLIENTE
===================================================== */

function editarCliente(id){

    const cliente =
        clientes.find(
            function(item){

                return String(
                    item.id
                )
                ===
                String(id);

            }
        );


    if(!cliente){

        mostrarMensagem(
            "Cliente não encontrado.",
            "erro"
        );

        return;

    }


    clienteEditandoId =
        cliente.id;


    nomeCliente.value =
        cliente.nome || "";

    telefoneCliente.value =
        cliente.telefone || "";

    enderecoCliente.value =
        cliente.endereco || "";

    observacoesCliente.value =
        cliente.observacoes || "";


    btnSalvar.textContent =
        "💾 ATUALIZAR CLIENTE";


    btnCancelar.classList.add(
        "mostrar"
    );


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });


    nomeCliente.focus();


    mostrarMensagem(
        "Cliente carregado para edição.",
        "info"
    );

}


/* =====================================================
   CANCELAR EDIÇÃO
===================================================== */

btnCancelar.addEventListener(
    "click",
    function(){

        limparFormulario();

        mostrarMensagem(
            "Edição cancelada.",
            "info"
        );

    }
);


/* =====================================================
   SALVAR
===================================================== */

async function salvarCliente(){

    const nome =
        nomeCliente.value.trim();

    const telefone =
        telefoneCliente.value.trim();

    const endereco =
        enderecoCliente.value.trim();

    const observacoes =
        observacoesCliente.value.trim();


    if(!nome){

        mostrarMensagem(
            "Digite o nome do cliente.",
            "erro"
        );

        nomeCliente.focus();

        return;

    }


    btnSalvar.disabled =
        true;

    btnSalvar.textContent =
        clienteEditandoId
            ?
            "⏳ ATUALIZANDO..."
            :
            "⏳ SALVANDO...";


    try{

        if(clienteEditandoId){

            const resposta =
                await supabase
                    .from("clientes")
                    .update({
                        nome,
                        telefone,
                        endereco,
                        observacoes
                    })
                    .eq(
                        "id",
                        clienteEditandoId
                    );


            if(resposta.error){

                throw resposta.error;

            }


            mostrarMensagem(
                "Cliente atualizado com sucesso!",
                "sucesso"
            );


        }else{

            const resposta =
                await supabase
                    .from("clientes")
                    .insert([
                        {
                            nome,
                            telefone,
                            endereco,
                            observacoes
                        }
                    ]);


            if(resposta.error){

                throw resposta.error;

            }


            mostrarMensagem(
                "Cliente cadastrado com sucesso!",
                "sucesso"
            );

        }


        limparFormulario();

        await carregarClientes();


    }catch(erro){

        console.error(
            "Erro ao salvar cliente:",
            erro
        );

        mostrarMensagem(
            "Não foi possível salvar o cliente. Verifique as permissões da tabela no Supabase.",
            "erro"
        );

    }finally{

        btnSalvar.disabled =
            false;

        if(clienteEditandoId){

            btnSalvar.textContent =
                "💾 ATUALIZAR CLIENTE";

        }else{

            btnSalvar.textContent =
                "💾 SALVAR CLIENTE";

        }

    }

}


/* =====================================================
   EXCLUIR
===================================================== */

async function excluirCliente(id){

    const cliente =
        clientes.find(
            function(item){

                return String(
                    item.id
                )
                ===
                String(id);

            }
        );


    if(!cliente){

        mostrarMensagem(
            "Cliente não encontrado.",
            "erro"
        );

        return;

    }


    const confirmou =
        confirm(
            `Deseja realmente excluir o cliente "${cliente.nome}"?`
        );


    if(!confirmou){

        return;

    }


    try{

        const resposta =
            await supabase
                .from("clientes")
                .delete()
                .eq(
                    "id",
                    id
                );


        if(resposta.error){

            throw resposta.error;

        }


        if(
            String(
                clienteEditandoId
            )
            ===
            String(id)
        ){

            limparFormulario();

        }


        mostrarMensagem(
            "Cliente excluído com sucesso.",
            "sucesso"
        );


        await carregarClientes();


    }catch(erro){

        console.error(
            "Erro ao excluir cliente:",
            erro
        );

        mostrarMensagem(
            "Não foi possível excluir o cliente. Verifique as políticas RLS.",
            "erro"
        );

    }

}


/* =====================================================
   EVENTOS
===================================================== */

btnSalvar.addEventListener(
    "click",
    salvarCliente
);


pesquisaCliente.addEventListener(
    "input",
    renderizarClientes
);


/* =====================================================
   ENTER NO FORMULÁRIO
===================================================== */

[
    nomeCliente,
    telefoneCliente,
    enderecoCliente
].forEach(
    function(campo){

        campo.addEventListener(
            "keydown",
            function(event){

                if(
                    event.key === "Enter"
                ){

                    event.preventDefault();

                    salvarCliente();

                }

            }
        );

    }
);


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        carregarClientes();

    }
);

</script>
