<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#080808">

<link rel="stylesheet" href="tema-laranja.css"><meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<title>GrillCore ERP — Acesso</title><style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#fff;

    background:
        radial-gradient(
            circle at top,
            #351300 0%,
            #180900 30%,
            #080808 72%
        );

}

.login-container{

    width:100%;
    max-width:430px;

    margin:auto;

}

.logo-area{

    text-align:center;

    margin-bottom:24px;

}

.logo-icon{

    width:78px;
    height:78px;

    margin:0 auto 10px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            #ff7300,
            #b94700
        );

    border:1px solid #ff9a3d;

    font-size:44px;

    box-shadow:
        0 12px 35px rgba(0,0,0,.55),
        0 0 28px rgba(255,115,0,.20);

}

.logo-area h1{

    font-size:38px;

    line-height:1;

    color:#ff8a1f;

    letter-spacing:1px;

    text-shadow:
        0 2px 12px rgba(0,0,0,.7);

}

.logo-area h2{

    margin-top:8px;

    color:#fff;

    font-size:13px;

    font-weight:bold;

    letter-spacing:3px;

    opacity:.9;

}

.login-card{

    width:100%;

    padding:28px 24px;

    background:
        linear-gradient(
            145deg,
            rgba(27,15,8,.98),
            rgba(10,10,10,.98)
        );

    border:1px solid rgba(255,115,0,.38);

    border-radius:24px;

    box-shadow:
        0 25px 60px rgba(0,0,0,.65),
        0 0 30px rgba(255,115,0,.05),
        inset 0 1px 0 rgba(255,255,255,.05);

}

.login-title{

    text-align:center;

    margin-bottom:25px;

    color:#ff9a3d;

    font-size:22px;

    font-weight:bold;

}

.form-group{

    margin-bottom:17px;

}

label{

    display:block;

    margin-bottom:7px;

    color:#ddd;

    font-size:14px;

    font-weight:bold;

}

.input-wrapper{

    position:relative;

}

input{

    width:100%;

    min-height:52px;

    padding:15px;

    border-radius:12px;

    border:1px solid #49301b;

    background:#0b0b0b;

    color:#fff;

    font-size:16px;

    outline:none;

    transition:
        border-color .2s,
        box-shadow .2s;

}

input:focus{

    border-color:#ff7300;

    box-shadow:
        0 0 0 2px rgba(255,115,0,.12);

}

input::placeholder{

    color:#777;

}

#senha{

    padding-right:52px;

}

.btn-senha{

    position:absolute;

    right:5px;
    top:5px;

    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:none;

    border-radius:9px;

    background:transparent;

    color:#ff8a1f;

    font-size:19px;

    cursor:pointer;

}

.btn-senha:hover{

    background:#241207;

}

.btn-entrar{

    width:100%;

    min-height:54px;

    margin-top:7px;

    border:none;

    border-radius:13px;

    background:
        linear-gradient(
            145deg,
            #ff8a1f,
            #d95700
        );

    color:#120900;

    font-size:16px;

    font-weight:900;

    letter-spacing:.4px;

    cursor:pointer;

    box-shadow:
        0 8px 20px rgba(0,0,0,.4);

}

.btn-entrar:active{

    transform:scale(.98);

}

.btn-entrar:disabled{

    opacity:.7;

    cursor:wait;

}

.erro{

    display:none;

    margin-top:15px;

    padding:13px;

    border-radius:10px;

    text-align:center;

    background:#3d1208;

    border:1px solid #9d3515;

    color:#ff9a7a;

    font-size:14px;

}

.acoes-login{

    display:flex;

    justify-content:center;

    gap:18px;

    margin-top:20px;

}

.acoes-login button{

    width:auto;

    margin:0;

    padding:5px;

    border:none;

    background:transparent;

    color:#ff9a3d;

    font-size:13px;

    cursor:pointer;

}

.acoes-login button:hover{

    color:#ffb56f;

    text-decoration:underline;

}

.divisor{

    height:1px;

    margin:23px 0 18px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,115,0,.35),
            transparent
        );

}

.admin-info{

    text-align:center;

    color:#777;

    font-size:12px;

    line-height:1.5;

}

.admin-info strong{

    color:#ff8a1f;

}

.info{

    text-align:center;

    margin-top:20px;

    color:#777;

    font-size:11px;

}

.info span{

    color:#ff7300;

}

@media(max-width:480px){

    body{
        padding:15px;
    }

    .login-card{
        padding:25px 18px;
        border-radius:20px;
    }

    .logo-area h1{
        font-size:34px;
    }

}

@media(max-width:350px){

    .acoes-login{

        flex-direction:column;

        gap:7px;

    }

}

</style></head><body><div class="login-container"><div class="logo-area">

    <div class="logo-icon">
        🍔
    </div>

    <h1>
        GrillCore
    </h1>

    <h2>
        ERP • HAMBÚRGUERIA
    </h2>

</div>


<div class="login-card">

    <div class="login-title">
        🔐 Acesso ao Sistema
    </div>


    <div class="form-group">

        <label for="usuario">
            👤 Usuário
        </label>

        <input
            id="usuario"
            type="text"
            placeholder="Digite seu usuário"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false">

    </div>


    <div class="form-group">

        <label for="senha">
            🔑 Senha
        </label>

        <div class="input-wrapper">

            <input
                id="senha"
                type="password"
                placeholder="Digite sua senha"
                autocomplete="current-password">

            <button
                type="button"
                class="btn-senha"
                id="btnMostrarSenha"
                onclick="alternarSenha()"
                aria-label="Mostrar senha">

                👁️

            </button>

        </div>

    </div>


    <button
        type="button"
        class="btn-entrar"
        id="btnEntrar"
        onclick="entrar()">

        🔓 ENTRAR NO GRILLCORE

    </button>


    <div
        id="erro"
        class="erro"
        role="alert">

        ❌ Usuário ou senha incorretos.

    </div>


    <div class="acoes-login">

        <button
            type="button"
            onclick="recuperarAcesso()">

            🔑 Esqueci minha senha

        </button>


        <button
            type="button"
            onclick="falarComAdministrador()">

            💬 Falar com administrador

        </button>

    </div>


    <div class="divisor"></div>


    <div class="admin-info">

        🔒 <strong>Acesso protegido</strong><br>

        Entre com suas credenciais para acessar
        o painel de gestão.

    </div>

</div>


<div class="info">

    GrillCore ERP • Gestão profissional<br>

    <span>© 2026 GrillCore</span>

</div>

</div><script>

/* =====================================================
   🍔 GRILLCORE ERP
   LOGIN
===================================================== */


/* =====================================================
   🔐 DADOS PADRÃO
===================================================== */

const USUARIO_PADRAO = "admin";

const SENHA_PADRAO = "1234";

const CHAVE_USUARIO =
    "grillcore_usuario_login";

const CHAVE_SENHA =
    "grillcore_senha_login";


/* =====================================================
   🔐 OBTER USUÁRIO
===================================================== */

function obterUsuario(){

    const salvo =
        localStorage.getItem(
            CHAVE_USUARIO
        );

    return salvo || USUARIO_PADRAO;

}


/* =====================================================
   🔑 OBTER SENHA
===================================================== */

function obterSenha(){

    const salva =
        localStorage.getItem(
            CHAVE_SENHA
        );

    return salva || SENHA_PADRAO;

}


/* =====================================================
   👁️ MOSTRAR / OCULTAR SENHA
===================================================== */

function alternarSenha(){

    const campo =
        document.getElementById("senha");

    const botao =
        document.getElementById(
            "btnMostrarSenha"
        );


    if(campo.type === "password"){

        campo.type = "text";
botao.textContent = "😎";
        botao.setAttribute(
            "aria-label",
            "Ocultar senha"
        );

    }
    else{

        campo.type = "password";

        botao.textContent = "👁️";

        botao.setAttribute(
            "aria-label",
            "Mostrar senha"
        );

    }

}


/* =====================================================
   🔐 ENTRAR
===================================================== */

function entrar(){

    const campoUsuario =
        document.getElementById("usuario");

    const campoSenha =
        document.getElementById("senha");

    const erro =
        document.getElementById("erro");

    const botao =
        document.getElementById("btnEntrar");


    const usuario =
        campoUsuario.value.trim();

    const senha =
        campoSenha.value;


    erro.style.display = "none";


    if(!usuario){

        erro.textContent =
            "⚠️ Digite seu usuário.";

        erro.style.display = "block";

        campoUsuario.focus();

        return;

    }


    if(!senha){

        erro.textContent =
            "⚠️ Digite sua senha.";

        erro.style.display = "block";

        campoSenha.focus();

        return;

    }


    const usuarioCorreto =
        obterUsuario();

    const senhaCorreta =
        obterSenha();


    if(
        usuario === usuarioCorreto &&
        senha === senhaCorreta
    ){

        try{

            localStorage.setItem(
                "grillcore_login",
                "true"
            );

            localStorage.setItem(
                "grillcore_usuario",
                usuario
            );

        }
        catch(erroStorage){

            erro.textContent =
                "❌ Não foi possível salvar o acesso neste dispositivo.";

            erro.style.display = "block";

            return;

        }


        botao.disabled = true;

        botao.textContent =
            "✅ ACESSANDO GRILLCORE...";


        window.location.replace(
            "index.html"
        );

        return;

    }


    erro.textContent =
        "❌ Usuário ou senha incorretos.";

    erro.style.display = "block";

    campoSenha.value = "";

    campoSenha.focus();

}


/* =====================================================
   🔑 ESQUECI MINHA SENHA
===================================================== */

function recuperarAcesso(){
    window.location.href = "./recuperar-acesso.html";
}


/* =====================================================
   💬 ADMINISTRADOR
===================================================== */

function falarComAdministrador(){

    alert(
        "Você está usando o acesso administrativo do GrillCore. Para alterar sua senha, utilize a opção \"Esqueci minha senha\"."
    );

}


/* =====================================================
   ⌨️ ENTER
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            entrar();

        }

    }
);


/* =====================================================
   🚀 SESSÃO
===================================================== */

(function verificarSessao(){

    try{

        if(
            localStorage.getItem(
                "grillcore_login"
            ) === "true"
        ){

            window.location.replace(
                "index.html"
            );

        }

    }
    catch(erro){

        console.warn(
            "GrillCore: não foi possível verificar a sessão.",
            erro
        );

    }

})();


/* =====================================================
   🎯 FOCO
===================================================== */

window.addEventListener(
    "load",
    function(){

        const usuario =
            document.getElementById(
                "usuario"
            );

        if(usuario){

            usuario.focus();

        }

    }
);

</script></body></html>
