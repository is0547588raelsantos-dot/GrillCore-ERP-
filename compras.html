<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
if(localStorage.getItem("grillcore_login") !== "true") location.replace("login.html");
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#ff7300">
<title>Compras — GrillCore ERP</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="tema-laranja.css">
<style>
:root{--bg:#0b0b0b;--card:#171717;--card2:#111;--orange:#ff7300;--orange2:#ff9a3d;--gold:#d4af37;--red:#b9342a;--green:#35d07f;--text:#fff;--muted:#999}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,rgba(255,115,0,.10),transparent 32%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit}.page{width:100%;max-width:900px;margin:auto;padding:20px 14px 45px}
.header{text-align:center;margin-bottom:22px}.header .icon{width:66px;height:66px;margin:auto auto 12px;border-radius:19px;display:grid;place-items:center;font-size:30px;background:linear-gradient(145deg,var(--orange2),var(--orange));box-shadow:0 10px 28px #ff73002b}.header h1{margin:0;color:var(--orange2);font-size:clamp(29px,7vw,40px);font-weight:900}.header p{margin:6px auto 0;color:var(--muted);font-size:13px}
.card{background:linear-gradient(145deg,#1b1b1b,#111);border:1px solid #292929;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 14px 34px #0006}
.section-title{display:flex;align-items:center;gap:10px;color:var(--orange2);font-size:17px;font-weight:850;padding-bottom:12px;margin-bottom:16px;border-bottom:1px solid #292929}.num{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(145deg,var(--orange2),var(--orange));color:#fff;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:1.4fr .7fr .7fr;gap:14px}.field{margin-bottom:2px}.field label{display:block;font-size:12px;font-weight:750;color:#ddd;margin:0 0 6px}.req{color:#ff5c5c}.field input,.field select,.field textarea,.filter input,.filter select{width:100%;border:1px solid #333;border-radius:10px;background:#0b0b0b;color:#fff;padding:12px;outline:none}.field input:focus,.field select:focus,.field textarea:focus,.filter input:focus,.filter select:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff730014}.field textarea{min-height:82px;resize:vertical}.field input::placeholder,.field textarea::placeholder,.filter input::placeholder{color:#555}
.actions{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:25px;padding:13px 18px;font-weight:850;cursor:pointer;min-height:47px}.primary{flex:1;background:linear-gradient(135deg,var(--orange2),var(--orange),#d95700);color:#fff;box-shadow:0 8px 22px #ff73002b}.secondary{background:transparent;border:1px solid #333;color:#aaa}.secondary:hover{color:#fff;border-color:#555}
.msg{margin-top:14px}.msg div{padding:11px 13px;border-radius:10px;font-size:13px}.ok{background:#35d07f12;border:1px solid #35d07f45;color:#61e49a}.err{background:#ff555512;border:1px solid #ff555545;color:#ff7373}.warn{background:#f2c94c12;border:1px solid #f2c94c45;color:#f2c94c}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.sum{background:linear-gradient(145deg,#191919,#101010);border:1px solid #292929;border-radius:15px;padding:15px;position:relative;overflow:hidden}.sum:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--orange),var(--orange2))}.sum small{display:block;color:#888;font-size:10px;text-transform:uppercase;font-weight:800;margin-bottom:7px}.sum strong{display:block;color:var(--orange2);font-size:clamp(20px,5vw,27px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sum.green strong{color:var(--green)}
.history h2{font-size:20px;margin:0 0 14px}.history h2 span{color:var(--orange)}.filter{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px;background:#0b0b0b;border:1px solid #252525;padding:10px;border-radius:13px;margin-bottom:13px}.purchase{background:linear-gradient(145deg,#191919,#111);border:1px solid #292929;border-radius:14px;padding:15px;margin-bottom:10px}.top{display:flex;justify-content:space-between;gap:10px}.top h3{margin:0 0 4px;font-size:15px}.supplier{font-size:11px;color:#888}.supplier b{color:var(--orange2)}.status{font-size:9px;font-weight:900;padding:5px 8px;border-radius:999px;height:max-content}.registered{color:#35d07f;background:#35d07f12;border:1px solid #35d07f35}.cancelled{color:#ff7373;background:#ff555512;border:1px solid #ff555535}.details{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-top:1px solid #292929;margin-top:12px;padding-top:12px}.detail small{display:block;color:#666;font-size:10px;margin-bottom:3px}.detail b{font-size:12px;overflow-wrap:anywhere}.value{color:var(--green)!important;font-size:17px!important}.foot{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #222;margin-top:12px;padding-top:10px;color:#777;font-size:11px}.cancel{border:1px solid #ff55553d;background:#ff55550d;color:#ff7373;border-radius:9px;padding:7px 10px;font-size:10px;font-weight:800}.empty{text-align:center;padding:30px 15px;border:1px dashed #ff730033;border-radius:13px;color:#777}.empty .big{font-size:32px;margin-bottom:6px}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.nav a{text-decoration:none;text-align:center;padding:12px;border-radius:12px;background:#151515;border:1px solid #292929;color:#ccc;font-size:12px;font-weight:800}.nav a.main{background:linear-gradient(135deg,var(--orange2),var(--orange));color:#fff;border-color:var(--orange)}
@media(max-width:700px){.grid3{grid-template-columns:1fr 1fr}.filter{grid-template-columns:1fr 1fr}.filter input{grid-column:1/-1}.details{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.page{padding:15px 10px 35px}.grid,.grid3,.summary,.filter,.nav{grid-template-columns:1fr}.filter input{grid-column:auto}.card{padding:15px}.actions{flex-direction:column}.primary,.secondary{width:100%}.top{flex-direction:column}.status{width:max-content}.details{grid-template-columns:1fr 1fr}.foot{align-items:flex-start;flex-direction:column}.cancel{width:100%}}
</style>
</head>
<body>
<main class="page">
<header class="header"><div class="icon">🛒</div><h1>Compras</h1><p>Controle de mercadorias, fornecedores, estoque e despesas</p></header>

<section class="card">
<div class="section-title"><span class="num">1</span>Fornecedor</div>
<div class="grid">
<div class="field"><label>Fornecedor <span class="req">*</span></label><input id="fornecedor" list="listaFornecedores" placeholder="Nome do fornecedor" autocomplete="off"><datalist id="listaFornecedores"></datalist></div>
<div class="field"><label>Data da compra <span class="req">*</span></label><input type="date" id="dataCompra"></div>
</div>
</section>

<section class="card">
<div class="section-title"><span class="num">2</span>Mercadoria</div>
<div class="grid3">
<div class="field"><label>Mercadoria <span class="req">*</span></label><input id="mercadoria" placeholder="Ex.: Carne bovina"></div>
<div class="field"><label>Quantidade <span class="req">*</span></label><input type="number" id="quantidade" min=".001" step=".001" placeholder="0"></div>
<div class="field"><label>Unidade</label><select id="unidade"><option value="un">Unidade</option><option value="kg">Quilograma (kg)</option><option value="g">Grama (g)</option><option value="l">Litro (L)</option><option value="ml">Mililitro (ml)</option><option value="cx">Caixa</option><option value="pct">Pacote</option></select></div>
</div>
</section>

<section class="card">
<div class="section-title"><span class="num">3</span>Financeiro</div>
<div class="grid">
<div class="field"><label>Valor da compra <span class="req">*</span></label><input type="number" id="valorCompra" min=".01" step=".01" placeholder="0,00"></div>
<div class="field"><label>Forma de pagamento</label><select id="pagamento"><option>Pix</option><option>Dinheiro</option><option>Cartão</option><option>Boleto</option><option>Prazo</option><option>Outro</option></select></div>
</div>
</section>

<section class="card">
<div class="section-title"><span class="num">4</span>Observações</div>
<div class="field"><label>Observações da compra</label><textarea id="observacao" placeholder="Compra semanal, prazo, lote, fornecedor etc."></textarea></div>
<div id="mensagem" class="msg"></div>
<div class="actions"><button class="btn primary" onclick="registrarCompra()">✓ Confirmar compra</button><button class="btn secondary" onclick="limparFormulario()">Limpar</button></div>
</section>

<section class="summary">
<div class="sum"><small>Compras ativas</small><strong id="quantidadeCompras">0</strong></div>
<div class="sum green"><small>Total comprado</small><strong id="totalComprado">R$ 0,00</strong></div>
<div class="sum"><small>Total deste mês</small><strong id="totalMes">R$ 0,00</strong></div>
</section>

<section class="card history">
<h2>Histórico de <span>Compras</span></h2>
<div class="filter"><input id="buscaCompra" type="search" placeholder="🔎 Buscar compra, fornecedor ou mercadoria..."><select id="filtroStatus"><option value="todas">Todos os status</option><option value="registrada">Registradas</option><option value="cancelada">Canceladas</option></select><select id="filtroPeriodo"><option value="tudo">Todo período</option><option value="hoje">Hoje</option><option value="7dias">Últimos 7 dias</option><option value="mes">Este mês</option></select></div>
<div id="listaCompras"></div>
</section>

<nav class="nav">

    <button
        type="button"
        onclick="window.location.href='estoque.html'"
    >
        📦 Estoque
    </button>

    <button
        type="button"
        onclick="window.location.href='financeiro.html'"
    >
        💰 Financeiro
    </button>

    <button
        type="button"
        class="main"
        onclick="window.location.href='index.html'"
    >
        🏠 Dashboard
    </button>

</nav>
</main>

<script>
const $=id=>document.getElementById(id);
function ler(k){try{let x=JSON.parse(localStorage.getItem(k)||"[]");return Array.isArray(x)?x:[]}catch(e){return[]}}
function salvar(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){msg("Não foi possível salvar os dados.","err");return false}}
function num(v){if(v==null||v==="")return 0;if(typeof v==="number")return Number.isFinite(v)?v:0;let s=String(v).replace(/R\$/gi,"").trim();if(s.includes(",")&&s.includes("."))s=s.replace(/\./g,"").replace(",",".");else s=s.replace(",",".");let n=Number(s.replace(/[^0-9.-]/g,""));return Number.isFinite(n)?n:0}
function money(v){return num(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,9)}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function norm(v){return String(v??"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function today(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function dateOf(c){return c.data||c.dataCompra||c.createdAt||c.criadoEm||""}
function dateBR(v){if(!v)return"—";let s=String(v),m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:new Date(v).toLocaleDateString("pt-BR")}
function status(c){return String(c.status||"registrada").toLowerCase()==="cancelada"?"cancelada":"registrada"}
function active(c){return status(c)!=="cancelada"}
function msg(t,tipo="ok"){ $("mensagem").innerHTML=`<div class="${tipo}">${esc(t)}</div>`;clearTimeout(window.mt);window.mt=setTimeout(()=>$("mensagem").innerHTML="",4500)}
function fornecedores(){let n=ler("fornecedores").map(x=>x.nome||x.empresa||"").map(x=>String(x).trim()).filter(Boolean);n=[...new Set(n)].sort((a,b)=>a.localeCompare(b,"pt-BR"));$("listaFornecedores").innerHTML=n.map(x=>`<option value="${esc(x)}">`).join("")}
function limparFormulario(){["fornecedor","mercadoria","quantidade","valorCompra","observacao"].forEach(x=>$(x).value="");$("unidade").value="un";$("pagamento").value="Pix";$("dataCompra").value=today();$("mensagem").innerHTML=""}
function addHistorico(c,tipo="entrada"){let h=ler("historicoEstoque");h.push({id:id(),tipo,origem:tipo==="entrada"?"compra":"cancelamento_compra",compraId:c.id,mercadoria:c.mercadoria,produto:c.mercadoria,quantidade:num(c.quantidade),unidade:c.unidade||"un",fornecedor:c.fornecedor,valor:num(c.valor),data:dateOf(c),dataHora:new Date().toISOString()});salvar("historicoEstoque",h)}
function estoqueAdd(c){let e=ler("estoque"),n=norm(c.mercadoria),q=num(c.quantidade),item=e.find(x=>norm(x.mercadoria||x.nome||x.produto)===n);if(item){item.estoque=num(item.estoque??item.quantidade)+q;item.quantidade=num(item.quantidade)+q;item.unidade=item.unidade||c.unidade;item.fornecedor=item.fornecedor||c.fornecedor;item.atualizadoEm=new Date().toISOString()}else e.push({id:id(),mercadoria:c.mercadoria,nome:c.mercadoria,produto:c.mercadoria,categoria:"Outros",fornecedor:c.fornecedor,quantidade:q,estoque:q,unidade:c.unidade||"un",custo:num(c.valor),precoVenda:0,estoqueMinimo:0,criadoEm:new Date().toISOString(),atualizadoEm:new Date().toISOString()});salvar("estoque",e);addHistorico(c)}
function estoqueRemove(c){let e=ler("estoque"),n=norm(c.mercadoria),q=num(c.quantidade),item=e.find(x=>norm(x.mercadoria||x.nome||x.produto)===n);if(!item||num(item.estoque??item.quantidade)<q)return false;item.estoque=num(item.estoque??item.quantidade)-q;item.quantidade=Math.max(0,num(item.quantidade)-q);item.atualizadoEm=new Date().toISOString();salvar("estoque",e);addHistorico(c,"saida");return true}
function despesaAdd(c){let d=ler("despesas"),x={id:id(),origem:"compra",compraId:c.id,categoria:"Compras / Mercadorias",descricao:`Compra de ${c.mercadoria}`,fornecedor:c.fornecedor,valor:num(c.valor),formaPagamento:c.pagamento,pagamento:c.pagamento,data:dateOf(c),observacao:c.observacao||"",status:"ativa",criadoEm:new Date().toISOString()};d.push(x);salvar("despesas",d);return x}
function despesaCancel(c){let d=ler("despesas"),ok=false;d.forEach(x=>{if(String(x.compraId)===String(c.id)){x.status="cancelada";x.canceladaEm=new Date().toISOString();ok=true}});if(ok)salvar("despesas",d)}
function registrarCompra(){let c={fornecedor:$("fornecedor").value.trim(),data:$("dataCompra").value,mercadoria:$("mercadoria").value.trim(),quantidade:num($("quantidade").value),unidade:$("unidade").value,valor:num($("valorCompra").value),pagamento:$("pagamento").value,observacao:$("observacao").value.trim()};if(!c.fornecedor)return msg("Informe o fornecedor.","err");if(!c.data)return msg("Informe a data da compra.","err");if(!c.mercadoria)return msg("Informe a mercadoria.","err");if(c.quantidade<=0)return msg("Informe uma quantidade válida.","err");if(c.valor<=0)return msg("Informe um valor válido.","err");if(!confirm(`Registrar compra?\n\n${c.mercadoria}\n${c.quantidade} ${c.unidade}\n${money(c.valor)}\nFornecedor: ${c.fornecedor}`))return;c.id=id();c.produto=c.mercadoria;c.valorCompra=c.valor;c.formaPagamento=c.pagamento;c.dataCompra=c.data;c.status="registrada";c.criadoEm=new Date().toISOString();c.atualizadoEm=new Date().toISOString();let compras=ler("compras");compras.push(c);if(!salvar("compras",compras))return;estoqueAdd(c);let d=despesaAdd(c);c.despesaId=d.id;compras=ler("compras");let saved=compras.find(x=>String(x.id)===String(c.id));if(saved){saved.despesaId=d.id;salvar("compras",compras)}atualizar();msg("Compra registrada! Estoque e financeiro atualizados.","ok");limparCampos()}
function limparCampos(){["fornecedor","mercadoria","quantidade","valorCompra","observacao"].forEach(x=>$(x).value="");$("unidade").value="un";$("pagamento").value="Pix";$("dataCompra").value=today()}
function periodo(data,p){if(p==="tudo")return true;if(!data)return false;let d=String(data).match(/^\d{4}-\d{2}-\d{2}$/)?new Date(+data.slice(0,4),+data.slice(5,7)-1,+data.slice(8,10)):new Date(data),h=new Date();h.setHours(0,0,0,0);d.setHours(0,0,0,0);if(isNaN(d))return false;if(p==="hoje")return d.getTime()===h.getTime();if(p==="7dias"){let l=new Date(h);l.setDate(l.getDate()-6);return d>=l&&d<=h}if(p==="mes")return d.getMonth()===h.getMonth()&&d.getFullYear()===h.getFullYear();return true}
function resumo(){let a=ler("compras").filter(active),total=a.reduce((s,c)=>s+num(c.valor??c.valorCompra),0),now=new Date(),mes=a.filter(c=>{let d=new Date(dateOf(c));return !isNaN(d)&&d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()}).reduce((s,c)=>s+num(c.valor??c.valorCompra),0);$("quantidadeCompras").textContent=a.length;$("totalComprado").textContent=money(total);$("totalMes").textContent=money(mes)}
function mostrar(){let compras=ler("compras"),bus=norm($("buscaCompra").value),fs=$("filtroStatus").value,fp=$("filtroPeriodo").value;let arr=compras.filter(c=>(fs==="todas"||status(c)===fs)&&periodo(dateOf(c),fp)&&(!bus||norm([c.fornecedor,c.mercadoria,c.produto,c.unidade,c.pagamento,c.observacao].join(" ")).includes(bus))).sort((a,b)=>new Date(dateOf(b)).getTime()-new Date(dateOf(a)).getTime());if(!arr.length){$("listaCompras").innerHTML='<div class="empty"><div class="big">🛒</div><b>Nenhuma compra encontrada</b><p>Registre uma compra ou altere os filtros.</p></div>';return}$("listaCompras").innerHTML=arr.map(c=>{let can=status(c)==="cancelada",v=num(c.valor??c.valorCompra);return `<article class="purchase"><div class="top"><div><h3>${esc(c.mercadoria||c.produto||"Mercadoria")}</h3><div class="supplier">Fornecedor: <b>${esc(c.fornecedor||"Não informado")}</b></div></div><span class="status ${can?"cancelled":"registered"}">${can?"Cancelada":"Registrada"}</span></div><div class="details"><div class="detail"><small>Data</small><b>${dateBR(dateOf(c))}</b></div><div class="detail"><small>Quantidade</small><b>${esc(c.quantidade)} ${esc(c.unidade||"un")}</b></div><div class="detail"><small>Pagamento</small><b>${esc(c.pagamento||c.formaPagamento||"—")}</b></div><div class="detail"><small>Valor</small><b class="value">${money(v)}</b></div></div>${c.observacao?`<div class="foot"><span>📝 ${esc(c.observacao)}</span></div>`:""}<div class="foot"><span>ID: ${esc(String(c.id).slice(-8))}</span>${can?'<span>Compra cancelada</span>':`<button class="cancel" onclick="cancelarCompra('${esc(c.id)}')">Cancelar compra</button>`}</div></article>`}).join("")}
function cancelarCompra(idc){let compras=ler("compras"),i=compras.findIndex(c=>String(c.id)===String(idc));if(i<0)return msg("Compra não encontrada.","err");let c=compras[i];if(!active(c))return msg("Esta compra já está cancelada.","warn");let estoque=ler("estoque"),item=estoque.find(x=>norm(x.mercadoria||x.nome||x.produto)===norm(c.mercadoria));if(!item||num(item.estoque??item.quantidade)<num(c.quantidade))return msg("Não é possível cancelar: estoque insuficiente ou mercadoria não encontrada.","err");if(!confirm(`Cancelar ${c.mercadoria}?\n\nO estoque será revertido e a despesa será cancelada.`))return;if(!estoqueRemove(c))return msg("Não foi possível reverter o estoque.","err");despesaCancel(c);c.status="cancelada";c.canceladaEm=new Date().toISOString();c.atualizadoEm=new Date().toISOString();salvar("compras",compras);atualizar();msg("Compra cancelada e integrada ao estoque/financeiro.","ok")}
function atualizar(){fornecedores();resumo();mostrar()}
$("buscaCompra").addEventListener("input",mostrar);$("filtroStatus").addEventListener("change",mostrar);$("filtroPeriodo").addEventListener("change",mostrar);
document.addEventListener("DOMContentLoaded",()=>{$("dataCompra").value=today();atualizar()});
window.addEventListener("pageshow",atualizar);window.addEventListener("storage",e=>["compras","estoque","despesas","fornecedores","historicoEstoque"].includes(e.key)&&atualizar());
window.registrarCompra=registrarCompra;window.cancelarCompra=cancelarCompra;window.limparFormulario=limparFormulario;
</script>
</body>
    </html>
