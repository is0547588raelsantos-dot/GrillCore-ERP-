<!DOCTYPE html>
<html lang="pt-BR">

<head>

<script>
if(localStorage.getItem("grillcore_login") !== "true"){
    window.location.replace("login.html");
}
</script>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#ff7300">

<meta name="description"
      content="Gestão de clientes — GrillCore ERP">

<title>Clientes — GrillCore ERP</title>

<link rel="stylesheet"
      href="style.css">

<link rel="stylesheet"
      href="tema-laranja.css">


<style>

/* =====================================================
   🍔 GRILLCORE ERP
   CLIENTES — PADRÃO PROFISSIONAL
   PRETO + LARANJA
===================================================== */

:root{

    --cli-preto:#050505;
    --cli-preto2:#0b0b0b;
    --cli-card:#111111;
    --cli-card2:#171717;

    --cli-laranja:#ff7300;
    --cli-laranja2:#ff9800;
    --cli-laranja3:#ff4d00;

    --cli-branco:#ffffff;
    --cli-cinza:#aaa;
    --cli-cinza2:#777;

    --cli-verde:#29d66f;
    --cli-vermelho:#ff4d4d;

}


/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
}


/* =====================================================
   BODY
===================================================== */

body{

    margin:0;

    background:
        radial-gradient(
            circle at top,
            rgba(255,115,0,.10),
            transparent 34%
        ),
        linear-gradient(
            180deg,
            #090909 0%,
            #050505 100%
        );

    color:#fff;

}


/* =====================================================
   PÁGINA
===================================================== */

.clientes-page{

    width:100%;

    max-width:1100px;

    margin:0 auto;

    padding:
        12px
        12px
        45px;

}


/* =====================================================
   CABEÇALHO
===================================================== */

.clientes-header{

    text-align:center;

    padding:
        8px
        0
        25px;

}


.clientes-header .icone{

    width:66px;
    height:66px;

    margin:
        0
        auto
        12px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:19px;

    background:
        linear-gradient(
            145deg,
            #ff9800,
            #ff4d00
        );

    border:
        1px solid
        rgba(255,255,255,.18);

    font-size:33px;

    box-shadow:
        0 10px 30px
        rgba(255,115,0,.25);

}


.clientes-header h1{

    margin:0;

    color:#fff;

    font-size:
        clamp(
            32px,
            7vw,
            46px
        );

    line-height:1;

    font-weight:950;

    letter-spacing:-1.5px;

}


.clientes-header h1::after{

    content:"";

    display:block;

    width:58px;
    height:4px;

    margin:
        12px
        auto
        0;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            #ff4d00,
            #ff9800
        );

}


.clientes-header p{

    margin:
        11px
        0
        0;

    color:#929292;

    font-size:14px;

    font-weight:650;

}


/* =====================================================
   SEÇÕES
===================================================== */

.clientes-secao{

    position:relative;

    background:
        linear-gradient(
            145deg,
            #151515,
            #0b0b0b
        );

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:21px;

    padding:20px;

    margin-bottom:16px;

    overflow:hidden;

    box-shadow:
        0 14px 35px
        rgba(0,0,0,.38);

}


.clientes-secao::before{

    content:"";

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:3px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff7300,
            transparent
        );

}


/* =====================================================
   TÍTULOS
===================================================== */

.secao-titulo{

    margin:
        0
        0
        19px;

    text-align:center;

    color:#fff;

    font-size:
        clamp(
            20px,
            5vw,
            27px
        );

    line-height:1.15;

    font-weight:950;

}


.secao-titulo::after{

    content:"";

    display:block;

    width:46px;
    height:3px;

    margin:
        9px
        auto
        0;

    border-radius:10px;

    background:#ff7300;

}


/* =====================================================
   RESUMO
===================================================== */

.resumo-grid{

    display:grid;

    grid-template-columns:
        repeat(
            4,
            minmax(0,1fr)
        );

    gap:12px;

}


/* =====================================================
   CARD LARANJA
===================================================== */

.resumo-card{

    position:relative;

    min-width:0;

    min-height:142px;

    padding:
        14px
        9px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    border-radius:18px;

    background:
        linear-gradient(
            145deg,
            #ff9800 0%,
            #ff7300 45%,
            #ff4d00 100%
        );

    border:
        1px solid
        rgba(255,255,255,.18);

    color:#fff;

    overflow:hidden;

    box-shadow:
        0 10px 25px
        rgba(255,115,0,.17);

}


/* brilho superior */

.resumo-card::before{

    content:"";

    position:absolute;

    width:115px;
    height:115px;

    right:-55px;
    top:-55px;

    border-radius:50%;

    background:
        rgba(255,255,255,.10);

}


/* detalhe inferior */

.resumo-card::after{

    content:"";

    position:absolute;

    width:70px;
    height:70px;

    left:-34px;
    bottom:-34px;

    border-radius:50%;

    background:
        rgba(0,0,0,.10);

}


/* =====================================================
   ÍCONE
===================================================== */

.resumo-icone{

    position:relative;

    z-index:2;

    display:block;

    font-size:24px;

    line-height:1;

    margin-bottom:7px;

}


/* =====================================================
   LABEL
===================================================== */

.resumo-label{

    position:relative;

    z-index:2;

    width:100%;

    color:#fff;

    font-size:11px;

    line-height:1.2;

    font-weight:900;

    text-transform:uppercase;

    letter-spacing:.25px;

}


/* =====================================================
   NÚMEROS
===================================================== */

.resumo-numero{

    position:relative;

    z-index:2;

    display:block;

    width:100%;

    margin-top:7px;

    color:#fff;

    font-size:29px !important;

    line-height:1;

    font-weight:950;

    letter-spacing:-.8px;

    white-space:nowrap;

    text-align:center;

    text-shadow:
        0 3px 8px
        rgba(0,0,0,.22);

}


/* =====================================================
   VALORES MONETÁRIOS
   TAMANHO MENOR PARA NÃO CORTAR
===================================================== */

.resumo-numero.valor{

    font-size:20px !important;

    letter-spacing:-.5px;

}


/* =====================================================
   FORMULÁRIO
===================================================== */

.formulario{

    display:none;

    animation:
        aparecerFormulario
        .2s
        ease;

}


@keyframes aparecerFormulario{

    from{

        opacity:0;

        transform:
            translateY(-8px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


.formulario label{

    display:block;

    margin:
        15px
        0
        7px;

    color:#ddd;

    font-size:13px;

    font-weight:850;

}


.formulario input,
.formulario textarea{

    width:100%;

}


.formulario input:focus,
.formulario textarea:focus,
.busca-input:focus{

    border-color:
        #ff7300 !important;

    box-shadow:
        0 0 0 3px
        rgba(255,115,0,.12);

}


/* =====================================================
   BOTÃO PRINCIPAL
===================================================== */

.botao-principal{

    width:100%;

    min-height:58px;

    margin-bottom:14px;

    border:none;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            #ff9800,
            #ff4d00
        );

    color:#fff;

    font-size:15px;

    font-weight:950;

    letter-spacing:.2px;

    cursor:pointer;

    box-shadow:
        0 10px 26px
        rgba(255,115,0,.20);

    transition:
        transform .18s ease,
        filter .18s ease;

}


.botao-principal:hover{

    transform:
        translateY(-2px);

    filter:
        brightness(1.08);

}


.botao-principal:active{

    transform:
        scale(.98);

}


/* =====================================================
   BOTÃO CANCELAR
===================================================== */

.botao-cancelar{

    width:100%;

    min-height:52px;

    margin-top:0;

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius:15px;

    background:#111;

    color:#aaa;

    font-size:13px;

    font-weight:900;

    cursor:pointer;

}


.botao-cancelar:hover{

    color:#fff;

    border-color:
        rgba(255,115,0,.4);

}


/* =====================================================
   BUSCA
===================================================== */

.busca-area{

    display:flex;

    flex-direction:column;

    align-items:center;

}


.busca-label{

    color:#ff9800;

    font-size:11px;

    font-weight:900;

    text-transform:uppercase;

    letter-spacing:1px;

    margin-bottom:9px;

}


.busca-input{

    width:100%;

    max-width:650px;

    min-height:54px;

    padding:
        0
        16px;

    text-align:center;

    border-radius:15px !important;

    background:#080808 !important;

}


/* =====================================================
   LISTA
===================================================== */

.lista-titulo{

    margin:
        24px
        0
        14px;

    text-align:center;

    color:#fff;

    font-size:22px;

    line-height:1.2;

    font-weight:950;

}


.lista-titulo::after{

    content:"";

    display:block;

    width:42px;
    height:3px;

    margin:
        8px
        auto
        0;

    border-radius:10px;

    background:#ff7300;

}


/* =====================================================
   CARD DO CLIENTE
===================================================== */

.cliente{

    position:relative;

    background:
        linear-gradient(
            145deg,
            #181818,
            #0c0c0c
        );

    border:
        1px solid
        rgba(255,115,0,.22);

    border-radius:20px;

    padding:19px;

    margin-bottom:14px;

    box-shadow:
        0 10px 28px
        rgba(0,0,0,.38);

    overflow:hidden;

}


.cliente::before{

    content:"";

    position:absolute;

    left:0;
    top:0;

    width:4px;
    height:100%;

    background:
        linear-gradient(
            180deg,
            #ff9800,
            #ff4d00
        );

}


/* =====================================================
   TOPO CLIENTE
===================================================== */

.cliente-topo{

    display:flex;

    align-items:center;

    gap:12px;

    margin-bottom:15px;

}


.cliente-avatar{

    flex:
        0 0
        48px;

    width:48px;
    height:48px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            #ff9800,
            #ff4d00
        );

    font-size:24px;

    box-shadow:
        0 7px 18px
        rgba(255,115,0,.16);

}


.cliente-titulo{

    min-width:0;

    flex:1;

}


.cliente h3{

    margin:0;

    color:#fff;

    font-size:19px;

    line-height:1.15;

    font-weight:950;

    word-break:break-word;

}


.cliente-status{

    display:inline-block;

    margin-top:5px;

    color:#ff9800;

    font-size:10px;

    font-weight:900;

    text-transform:uppercase;

    letter-spacing:.7px;

}


/* =====================================================
   INFORMAÇÕES
===================================================== */

.cliente-info{

    display:grid;

    gap:8px;

    color:#aaa;

    line-height:1.45;

}


.cliente-info p{

    margin:0;

    padding:
        9px
        10px;

    border-radius:10px;

    background:
        rgba(255,255,255,.025);

    font-size:13px;

}


.cliente-info strong{

    color:#ddd;

}


/* =====================================================
   SEPARADOR
===================================================== */

.cliente hr{

    border:0;

    border-top:
        1px solid
        rgba(255,115,0,.15);

    margin:
        16px
        0;

}


/* =====================================================
   ESTATÍSTICAS
===================================================== */

.estatisticas{

    display:grid;

    grid-template-columns:
        repeat(
            3,
            minmax(0,1fr)
        );

    gap:8px;

}


.estatistica{

    min-width:0;

    padding:
        12px
        6px;

    text-align:center;

    border-radius:13px;

    background:#101010;

    border:
        1px solid
        rgba(255,255,255,.07);

    color:#999;

    font-size:9px;

    line-height:1.2;

    font-weight:800;

}


.estatistica strong{

    display:block;

    margin-top:6px;

    color:#ff9800;

    font-size:16px;

    line-height:1.05;

    font-weight:950;

    white-space:nowrap;

}


.estatistica strong.verde{

    color:#29d66f;

}


/* =====================================================
   AÇÕES
===================================================== */

.cliente-acoes{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:10px;

    margin-top:15px;

}


.cliente-acoes button{

    min-height:49px;

    margin:0;

    border-radius:13px;

    font-size:12px;

    font-weight:900;

    cursor:pointer;

}


.cliente-acoes .editar{

    background:
        rgba(255,115,0,.10);

    border:
        1px solid
        rgba(255,115,0,.4);

    color:#ff9800;

}


.cliente-acoes .editar:hover{

    background:
        rgba(255,115,0,.18);

}


.cliente-acoes .excluir{

    background:
        rgba(255,77,77,.06);

    border:
        1px solid
        rgba(255,77,77,.3);

    color:#ff7777;

}


.cliente-acoes .excluir:hover{

    background:
        rgba(255,77,77,.12);

}


/* =====================================================
   VAZIO
===================================================== */

.vazio{

    text-align:center;

    padding:
        35px
        15px;

    color:#777;

    font-size:14px;

}


.vazio-icon{

    display:block;

    font-size:42px;

    margin-bottom:10px;

}


/* =====================================================
   VOLTAR
===================================================== */

.voltar-clientes{

    width:100%;

    min-height:55px;

    margin-top:4px;

    border:
        1px solid
        rgba(255,115,0,.25);

    border-radius:15px;

    background:#111;

    color:#ddd;

    font-size:13px;

    font-weight:900;

    cursor:pointer;

}


.voltar-clientes:hover{

    color:#fff;

    border-color:#ff7300;

}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:850px){

    .resumo-grid{

        grid-template-columns:
            repeat(
                2,
                minmax(0,1fr)
            );

    }

}


/* =====================================================
   CELULAR
===================================================== */

@media(max-width:600px){

    .clientes-page{

        padding:
            8px
            8px
            35px;

    }


    .clientes-header{

        padding-bottom:20px;

    }


    .clientes-header .icone{

        width:58px;
        height:58px;

        font-size:29px;

        border-radius:17px;

    }


    .clientes-header h1{

        font-size:34px;

    }


    .clientes-header p{

        font-size:12px;

    }


    .clientes-secao{

        padding:
            17px
            12px;

        border-radius:18px;

    }


    .secao-titulo{

        font-size:20px;

    }


    /* =================================================
       CARDS DO RESUMO
    ================================================= */

    .resumo-grid{

        grid-template-columns:
            repeat(
                2,
                minmax(0,1fr)
            );

        gap:9px;

    }


    .resumo-card{

        min-height:120px;

        padding:
            12px
            5px;

        border-radius:15px;

    }


    .resumo-icone{

        font-size:21px;

        margin-bottom:6px;

    }


    .resumo-label{

        font-size:8.5px;

        letter-spacing:.1px;

    }


    /* NÚMEROS INTEIROS */

    .resumo-numero{

        font-size:25px !important;

        margin-top:6px;

        letter-spacing:-.5px;

    }


    /* DINHEIRO */

    .resumo-numero.valor{

        font-size:16px !important;

        letter-spacing:-.35px;

    }


    .botao-principal{

        min-height:56px;

        font-size:14px;

    }


    .cliente{

        padding:
            16px
            13px;

    }


    .cliente h3{

        font-size:18px;

    }


    .cliente-info p{

        font-size:12px;

    }


    .estatisticas{

        gap:7px;

    }


    .estatistica{

        font-size:8.5px;

        padding:
            11px
            4px;

    }


    .estatistica strong{

        font-size:14px;

    }

}


/* =====================================================
   CELULAR PEQUENO
===================================================== */

@media(max-width:380px){

    .clientes-page{

        padding-left:6px;
        padding-right:6px;

    }


    .resumo-grid{

        gap:7px;

    }


    .resumo-card{

        min-height:113px;

        padding:
            10px
            4px;

    }


    .resumo-icone{

        font-size:19px;

    }


    .resumo-label{

        font-size:8px;

    }


    .resumo-numero{

        font-size:23px !important;

    }


    .resumo-numero.valor{

        font-size:14px !important;

    }


    .cliente-avatar{

        width:44px;
        height:44px;

        flex-basis:44px;

        font-size:21px;

    }


    .cliente-acoes{

        grid-template-columns:
            1fr;

    }

}


/* =====================================================
   MUITO PEQUENO
===================================================== */

@media(max-width:330px){

    .resumo-numero{

        font-size:21px !important;

    }


    .resumo-numero.valor{

        font-size:13px !important;

    }

}

</style>

</head>


<body>


<div class="container clientes-page">


<!-- =====================================================
     CABEÇALHO
===================================================== -->

<header class="clientes-header">

    <div class="icone">
        👥
    </div>


    <h1>
        Clientes
    </h1>


    <p>
        Gestão profissional da sua base de clientes
    </p>

</header>


<!-- =====================================================
     RESUMO
===================================================== -->

<section class="clientes-secao">

    <h2 class="secao-titulo">
        📊 Resumo de Clientes
    </h2>


    <div class="resumo-grid">


        <div class="resumo-card">

            <span class="resumo-icone">
                👥
            </span>


            <span class="resumo-label">
                Clientes cadastrados
            </span>


            <strong
                id="totalClientes"
                class="resumo-numero">

                0

            </strong>

        </div>


        <div class="resumo-card">

            <span class="resumo-icone">
                🧾
            </span>


            <span class="resumo-label">
                Total de pedidos
            </span>


            <strong
                id="totalPedidos"
                class="resumo-numero">

                0

            </strong>

        </div>


        <div class="resumo-card">

            <span class="resumo-icone">
                💰
            </span>


            <span class="resumo-label">
                Faturamento
            </span>


            <strong
                id="faturamentoClientes"
                class="resumo-numero valor">

                R$ 0,00

            </strong>

        </div>


        <div class="resumo-card">

            <span class="resumo-icone">
                📈
            </span>


            <span class="resumo-label">
                Ticket médio
            </span>


            <strong
                id="ticketMedioClientes"
                class="resumo-numero valor">

                R$ 0,00

            </strong>

        </div>

    </div>

</section>


<!-- =====================================================
     NOVO CLIENTE
===================================================== -->

<button
    class="botao-principal"
    onclick="mostrarFormulario()">

    ➕ &nbsp; NOVO CLIENTE

</button>


<!-- =====================================================
     FORMULÁRIO
===================================================== -->

<section
    id="formularioCliente"
    class="clientes-secao formulario">


    <h2
        id="tituloFormulario"
        class="secao-titulo">

        ➕ Cadastrar Cliente

    </h2>


    <input
        type="hidden"
        id="clienteId">


    <label for="clienteNome">
        👤 Nome completo
    </label>


    <input
        type="text"
        id="clienteNome"
        maxlength="100"
        autocomplete="name"
        placeholder="Digite o nome do cliente">


    <label for="clienteTelefone">
        📱 Telefone / WhatsApp
    </label>


    <input
        type="tel"
        id="clienteTelefone"
        maxlength="20"
        autocomplete="tel"
        placeholder="(00) 00000-0000">


    <label for="clienteEndereco">
        🏠 Endereço
    </label>


    <input
        type="text"
        id="clienteEndereco"
        maxlength="200"
        autocomplete="street-address"
        placeholder="Rua, número, bairro">


    <label for="clienteObservacoes">
        📝 Observações
    </label>


    <textarea
        id="clienteObservacoes"
        maxlength="500"
        rows="4"
        placeholder="Preferências, observações ou informações importantes..."></textarea>


    <button
        class="botao-principal"
        onclick="salvarCliente()">

        💾 &nbsp; SALVAR CLIENTE

    </button>


    <button
        class="botao-cancelar"
        onclick="cancelarFormulario()">

        ❌ &nbsp; CANCELAR

    </button>

</section>


<!-- =====================================================
     BUSCA
===================================================== -->

<section class="clientes-secao">


    <h2 class="secao-titulo">
        🔎 Buscar Cliente
    </h2>


    <div class="busca-area">

        <div class="busca-label">
            Nome ou telefone
        </div>


        <input
            type="search"
            id="buscaCliente"
            class="busca-input"
            autocomplete="off"
            placeholder="🔎 Digite para pesquisar..."
            oninput="mostrarClientes()">

    </div>

</section>


<!-- =====================================================
     LISTA
===================================================== -->

<h2 class="lista-titulo">
    📋 Clientes cadastrados
</h2>


<div id="listaClientes">

    <div class="clientes-secao">

        <p class="vazio">

            <span class="vazio-icon">
                ⏳
            </span>

            Carregando clientes...

        </p>

    </div>

</div>


<!-- =====================================================
     VOLTAR
===================================================== -->

<button
    class="voltar-clientes"
    onclick="window.location.href='index.html'">

    🏠 &nbsp; VOLTAR AO INÍCIO

</button>


</div>


<script>

/* =====================================================
   CLIENTES
===================================================== */

function pegarClientes(){

    try{

        const dados =
            JSON.parse(
                localStorage.getItem("clientes")
            );

        return Array.isArray(dados)
            ? dados
            : [];

    }
    catch(e){

        return [];

    }

}


function salvarClientes(clientes){

    try{

        localStorage.setItem(
            "clientes",
            JSON.stringify(clientes)
        );

        return true;

    }
    catch(e){

        console.error(
            "Erro ao salvar clientes:",
            e
        );

        return false;

    }

}


/* =====================================================
   VENDAS
===================================================== */

function pegarVendas(){

    try{

        const dados =
            JSON.parse(
                localStorage.getItem("vendas")
            );

        return Array.isArray(dados)
            ? dados
            : [];

    }
    catch(e){

        return [];

    }

}


/* =====================================================
   DINHEIRO
===================================================== */

function dinheiro(valor){

    const numero =
        valorNumericoSeguro(valor);

    return numero.toLocaleString(
        "pt-BR",
        {
            style:"currency",
            currency:"BRL"
        }
    );

}


/* =====================================================
   VALOR NUMÉRICO
===================================================== */

function valorNumericoSeguro(valor){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){

        return 0;

    }


    if(
        typeof valor === "number"
    ){

        return Number.isFinite(valor)
            ? valor
            : 0;

    }


    let texto =
        String(valor)
        .trim()
        .replace(/R\$/gi,"")
        .replace(/\s/g,"");


    if(!texto){

        return 0;

    }


    if(texto.includes(",")){

        texto =
            texto.replace(/\./g,"");

        texto =
            texto.replace(",", ".");

    }


    texto =
        texto.replace(
            /[^0-9.-]/g,
            ""
        );


    const numero =
        Number(texto);


    return Number.isFinite(numero)
        ? numero
        : 0;

}


/* =====================================================
   ID
===================================================== */

function gerarIdCliente(){

    return (
        Date.now()
        +
        Math.floor(
            Math.random() * 1000
        )
    );

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapar(texto){

    return String(
        texto ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   NORMALIZAR
===================================================== */

function normalizar(texto){

    return String(
        texto ?? ""
    )
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    );

}


/* =====================================================
   FORMULÁRIO
===================================================== */

function mostrarFormulario(){

    const formulario =
        document.getElementById(
            "formularioCliente"
        );


    formulario.style.display =
        "block";


    document.getElementById(
        "tituloFormulario"
    ).innerText =
        "➕ Cadastrar Cliente";


    limparFormulario();


    formulario.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });


    setTimeout(
        function(){

            document
                .getElementById(
                    "clienteNome"
                )
                .focus();

        },
        250
    );

}


function cancelarFormulario(){

    document.getElementById(
        "formularioCliente"
    ).style.display =
        "none";


    limparFormulario();

}


function limparFormulario(){

    document.getElementById(
        "clienteId"
    ).value = "";


    document.getElementById(
        "clienteNome"
    ).value = "";


    document.getElementById(
        "clienteTelefone"
    ).value = "";


    document.getElementById(
        "clienteEndereco"
    ).value = "";


    document.getElementById(
        "clienteObservacoes"
    ).value = "";

}


/* =====================================================
   SALVAR CLIENTE
===================================================== */

function salvarCliente(){

    const id =
        document.getElementById(
            "clienteId"
        ).value;


    const nome =
        document.getElementById(
            "clienteNome"
        ).value.trim();


    const telefone =
        document.getElementById(
            "clienteTelefone"
        ).value.trim();


    const endereco =
        document.getElementById(
            "clienteEndereco"
        ).value.trim();


    const observacoes =
        document.getElementById(
            "clienteObservacoes"
        ).value.trim();


    if(!nome){

        alert(
            "⚠️ Informe o nome do cliente."
        );

        document
            .getElementById(
                "clienteNome"
            )
            .focus();

        return;

    }


    let clientes =
        pegarClientes();


    /* =================================================
       EDIÇÃO
    ================================================= */

    if(id){

        const indice =
            clientes.findIndex(
                function(cliente){

                    return Number(
                        cliente.id
                    )
                    ===
                    Number(id);

                }
            );


        if(indice === -1){

            alert(
                "❌ Cliente não encontrado."
            );

            cancelarFormulario();

            return;

        }


        clientes[indice] = {

            ...clientes[indice],

            nome,
            telefone,
            endereco,
            observacoes,

            atualizadoEm:
                new Date().toISOString()

        };

    }


    /* =================================================
       NOVO CLIENTE
    ================================================= */

    else{

        const nomeNormalizado =
            normalizar(nome);


        const telefoneNormalizado =
            normalizar(telefone);


        const duplicado =
            clientes.find(
                function(cliente){

                    const mesmoNome =
                        nomeNormalizado &&
                        normalizar(
                            cliente.nome
                        ) ===
                        nomeNormalizado;


                    const mesmoTelefone =
                        telefoneNormalizado &&
                        normalizar(
                            cliente.telefone
                        ) ===
                        telefoneNormalizado;


                    return (
                        mesmoNome ||
                        mesmoTelefone
                    );

                }
            );


        if(duplicado){

            const confirmar =
                confirm(

                    "⚠️ Já existe um cliente parecido cadastrado.\n\n"

                    +
                    "Nome: "
                    +
                    (
                        duplicado.nome ||
                        "Não informado"
                    )

                    +
                    "\nTelefone: "
                    +
                    (
                        duplicado.telefone ||
                        "Não informado"
                    )

                    +
                    "\n\nDeseja cadastrar mesmo assim?"

                );


            if(!confirmar){

                return;

            }

        }


        const agora =
            new Date().toISOString();


        clientes.push({

            id:
                gerarIdCliente(),

            nome,
            telefone,
            endereco,
            observacoes,

            criadoEm:
                agora,

            atualizadoEm:
                agora

        });

    }


    if(
        !salvarClientes(clientes)
    ){

        alert(
            "❌ Não foi possível salvar o cliente."
        );

        return;

    }


    cancelarFormulario();

    atualizarResumo();

    mostrarClientes();


    alert(
        id
        ?
        "✅ Cliente atualizado com sucesso!"
        :
        "✅ Cliente cadastrado com sucesso!"
    );

}


/* =====================================================
   EDITAR
===================================================== */

function editarCliente(id){

    const clientes =
        pegarClientes();


    const cliente =
        clientes.find(
            function(item){

                return Number(
                    item.id
                )
                ===
                Number(id);

            }
        );


    if(!cliente){

        alert(
            "❌ Cliente não encontrado."
        );

        return;

    }


    document.getElementById(
        "formularioCliente"
    ).style.display =
        "block";


    document.getElementById(
        "tituloFormulario"
    ).innerText =
        "✏️ Editar Cliente";


    document.getElementById(
        "clienteId"
    ).value =
        cliente.id;


    document.getElementById(
        "clienteNome"
    ).value =
        cliente.nome || "";


    document.getElementById(
        "clienteTelefone"
    ).value =
        cliente.telefone || "";


    document.getElementById(
        "clienteEndereco"
    ).value =
        cliente.endereco || "";


    document.getElementById(
        "clienteObservacoes"
    ).value =
        cliente.observacoes || "";


    const formulario =
        document.getElementById(
            "formularioCliente"
        );


    formulario.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });


    setTimeout(
        function(){

            document
                .getElementById(
                    "clienteNome"
                )
                .focus();

        },
        250
    );

}


/* =====================================================
   EXCLUIR
===================================================== */

function excluirCliente(id){

    let clientes =
        pegarClientes();


    const cliente =
        clientes.find(
            function(item){

                return Number(
                    item.id
                )
                ===
                Number(id);

            }
        );


    if(!cliente){

        return;

    }


    const confirmar =
        confirm(

            "🗑️ EXCLUIR CLIENTE?\n\n"

            +
            "Cliente: "
            +
            (
                cliente.nome ||
                "Não informado"
            )

            +
            "\n\nO histórico de vendas não será apagado."

        );


    if(!confirmar){

        return;

    }


    clientes =
        clientes.filter(
            function(item){

                return Number(
                    item.id
                )
                !==
                Number(id);

            }
        );


    if(
        !salvarClientes(clientes)
    ){

        alert(
            "❌ Não foi possível excluir o cliente."
        );

        return;

    }


    atualizarResumo();

    mostrarClientes();


    alert(
        "✅ Cliente excluído com sucesso."
    );

}


/* =====================================================
   ESTATÍSTICAS DO CLIENTE
===================================================== */

function estatisticasCliente(cliente){

    const vendas =
        pegarVendas();


    const idCliente =
        Number(cliente.id);


    const nomeCliente =
        normalizar(cliente.nome);


    const telefoneCliente =
        normalizar(cliente.telefone);


    const vendasCliente =
        vendas.filter(
            function(venda){

                const status =
                    normalizar(
                        venda.status
                    );


                if(
                    status === "cancelado" ||
                    status === "cancelada"
                ){

                    return false;

                }


                const idVenda =
                    Number(
                        venda.clienteId
                    );


                if(
                    idVenda &&
                    idCliente &&
                    idVenda === idCliente
                ){

                    return true;

                }


                const nomeVenda =
                    normalizar(
                        venda.cliente
                    );


                if(
                    nomeVenda &&
                    nomeCliente &&
                    nomeVenda === nomeCliente
                ){

                    return true;

                }


                const telefoneVenda =
                    normalizar(
                        venda.telefone
                    );


                if(
                    telefoneVenda &&
                    telefoneCliente &&
                    telefoneVenda === telefoneCliente
                ){

                    return true;

                }


                return false;

            }
        );


    let total = 0;


    vendasCliente.forEach(
        function(venda){

            total +=
                valorNumericoSeguro(
                    venda.total
                );

        }
    );


    const ticket =
        vendasCliente.length
        ?
        total / vendasCliente.length
        :
        0;


    return {

        pedidos:
            vendasCliente.length,

        total,

        ticket

    };

}


/* =====================================================
   MOSTRAR CLIENTES
===================================================== */

function mostrarClientes(){

    let clientes =
        pegarClientes();


    const campoBusca =
        document.getElementById(
            "buscaCliente"
        );


    const busca =
        normalizar(
            campoBusca
                ? campoBusca.value
                : ""
        );


    if(busca){

        clientes =
            clientes.filter(
                function(cliente){

                    const nome =
                        normalizar(
                            cliente.nome
                        );


                    const telefone =
                        normalizar(
                            cliente.telefone
                        );


                    return (
                        nome.includes(busca) ||
                        telefone.includes(busca)
                    );

                }
            );

    }


    const lista =
        document.getElementById(
            "listaClientes"
        );


    if(!clientes.length){

        lista.innerHTML = `

            <div class="clientes-secao">

                <p class="vazio">

                    <span class="vazio-icon">
                        📭
                    </span>

                    ${
                        busca
                        ?
                        "Nenhum cliente encontrado para essa busca."
                        :
                        "Nenhum cliente cadastrado ainda."
                    }

                </p>

            </div>

        `;

        return;

    }


    lista.innerHTML = "";


    clientes
        .slice()
        .sort(
            function(a,b){

                return String(
                    a.nome || ""
                ).localeCompare(
                    String(
                        b.nome || ""
                    ),
                    "pt-BR",
                    {
                        sensitivity:"base"
                    }
                );

            }
        )
        .forEach(
            function(cliente){

                const estatisticas =
                    estatisticasCliente(
                        cliente
                    );


                lista.innerHTML += `

                    <article class="cliente">


                        <div class="cliente-topo">

                            <div class="cliente-avatar">
                                👤
                            </div>


                            <div class="cliente-titulo">

                                <h3>
                                    ${escapar(
                                        cliente.nome
                                    )}
                                </h3>


                                <span class="cliente-status">
                                    Cliente cadastrado
                                </span>

                            </div>

                        </div>


                        <div class="cliente-info">

                            <p>
                                📱
                                <strong>
                                    Telefone:
                                </strong>

                                ${escapar(
                                    cliente.telefone ||
                                    "Não informado"
                                )}

                            </p>


                            <p>
                                🏠
                                <strong>
                                    Endereço:
                                </strong>

                                ${escapar(
                                    cliente.endereco ||
                                    "Não informado"
                                )}

                            </p>


                            <p>
                                📝
                                <strong>
                                    Observações:
                                </strong>

                                ${escapar(
                                    cliente.observacoes ||
                                    "Nenhuma"
                                )}

                            </p>

                        </div>


                        <hr>


                        <div class="estatisticas">


                            <div class="estatistica">

                                🧾 Pedidos

                                <strong>

                                    ${estatisticas.pedidos}

                                </strong>

                            </div>


                            <div class="estatistica">

                                💰 Total gasto

                                <strong class="verde">

                                    ${dinheiro(
                                        estatisticas.total
                                    )}

                                </strong>

                            </div>


                            <div class="estatistica">

                                📈 Ticket médio

                                <strong>

                                    ${dinheiro(
                                        estatisticas.ticket
                                    )}

                                </strong>

                            </div>

                        </div>


                        <div class="cliente-acoes">


                            <button
                                class="editar"
                                onclick="editarCliente(${Number(cliente.id)})">

                                ✏️ EDITAR

                            </button>


                            <button
                                class="excluir"
                                onclick="excluirCliente(${Number(cliente.id)})">

                                🗑️ EXCLUIR

                            </button>

                        </div>


                    </article>

                `;

            }
        );

}


/* =====================================================
   RESUMO GERAL
===================================================== */

function atualizarResumo(){

    const clientes =
        pegarClientes();


    const vendas =
        pegarVendas();


    let totalPedidos = 0;

    let faturamento = 0;


    vendas.forEach(
        function(venda){

            const status =
                normalizar(
                    venda.status
                );


            if(
                status === "cancelado" ||
                status === "cancelada"
            ){

                return;

            }


            faturamento +=
                valorNumericoSeguro(
                    venda.total
                );


            totalPedidos++;

        }
    );


    const ticketMedio =
        totalPedidos
        ?
        faturamento / totalPedidos
        :
        0;


    document.getElementById(
        "totalClientes"
    ).innerText =
        clientes.length;


    document.getElementById(
        "totalPedidos"
    ).innerText =
        totalPedidos;


    document.getElementById(
        "faturamentoClientes"
    ).innerText =
        dinheiro(faturamento);


    document.getElementById(
        "ticketMedioClientes"
    ).innerText =
        dinheiro(ticketMedio);

}


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

function iniciarClientes(){

    atualizarResumo();

    mostrarClientes();

}


window.addEventListener(
    "load",
    iniciarClientes
);


window.addEventListener(
    "pageshow",
    function(){

        atualizarResumo();

        mostrarClientes();

    }
);


/* =====================================================
   ATUALIZAÇÃO ENTRE ABAS
===================================================== */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key === "clientes" ||
            event.key === "vendas" ||
            event.key === null
        ){

            atualizarResumo();

            mostrarClientes();

        }

    }
);

</script>

</body>
