<!DOCTYPE html>
<html lang="pt-BR">

<head>

<script>
if (localStorage.getItem("grillcore_login") !== "true") {
    window.location.replace("login.html");
}
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0d0d">

<title>Histórico de Estoque — GrillCore ERP</title>

<style>

:root{
    --fundo:#0d0d0d;
    --card:#1b1b1b;
    --card2:#232323;
    --borda:rgba(212,175,55,.35);

    --dourado:#d4af37;
    --dourado-claro:#f0cf65;

    --laranja:#ff7300;

    --branco:#fff;
    --cinza:#a7a7a7;

    --verde:#35c759;
    --vermelho:#ff4d4d;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;

    background:
        radial-gradient(
            circle at top right,
            rgba(212,175,55,.08),
            transparent 30%
        ),
        var(--fundo);

    color:var(--branco);

    min-height:100vh;

    padding:16px;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
}


/* =========================
   TOPO
========================= */

.topo{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:22px;
}

.btn-voltar{
    width:42px;
    height:42px;

    border-radius:12px;

    border:1px solid #333;

    background:#181818;

    color:white;

    font-size:20px;

    cursor:pointer;
}

.btn-voltar:active{
    transform:scale(.94);
}

.titulo-area h1{
    font-size:24px;
    margin-bottom:4px;
}

.titulo-area p{
    color:var(--cinza);
    font-size:13px;
}


/* =========================
   MÉTRICAS
========================= */

.metricas{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:18px;
}

.metrica{
    background:
        linear-gradient(
            145deg,
            #242424,
            #181818
        );

    border:1px solid var(--borda);

    border-radius:16px;

    padding:15px;

    text-align:center;
}

.metrica-label{
    color:#999;
    font-size:11px;
    text-transform:uppercase;
    font-weight:bold;
    margin-bottom:7px;
}

.metrica-numero{
    font-size:24px;
    font-weight:900;
}

.entrada{
    color:var(--verde);
}

.saida{
    color:var(--vermelho);
}

.movimento{
    color:var(--dourado-claro);
}


/* =========================
   FILTROS
========================= */

.filtros{
    background:
        linear-gradient(
            145deg,
            #222,
            #181818
        );

    border:1px solid var(--borda);

    border-radius:18px;

    padding:18px;

    margin-bottom:18px;
}

.filtros-titulo{
    color:var(--dourado-claro);

    font-size:17px;

    font-weight:bold;

    margin-bottom:16px;
}

.grid-filtros{
    display:grid;

    grid-template-columns:
        2fr 1fr 1fr 1fr;

    gap:10px;
}

.campo label{
    display:block;

    font-size:12px;

    color:#bbb;

    margin-bottom:6px;
}

.campo input,
.campo select{

    width:100%;

    background:#111;

    color:white;

    border:1px solid #444;

    border-radius:10px;

    padding:12px;

    outline:none;

    font-size:14px;
}

.campo input:focus,
.campo select:focus{
    border-color:var(--dourado);
}

.campo select option{
    background:#111;
    color:white;
}


/* =========================
   BOTÕES
========================= */

.acoes{
    display:flex;

    gap:10px;

    margin-top:14px;
}

.btn{
    flex:1;

    padding:13px;

    border-radius:12px;

    border:1px solid #444;

    background:#171717;

    color:white;

    font-weight:bold;

    cursor:pointer;
}

.btn-filtrar{
    background:
        linear-gradient(
            135deg,
            #ff7300,
            #c94f00
        );

    border:none;
}

.btn-limpar:hover{
    border-color:var(--dourado);
}

.btn:active{
    transform:scale(.98);
}


/* =========================
   LISTA
========================= */

.lista{
    background:#171717;

    border:1px solid #303030;

    border-radius:18px;

    overflow:hidden;
}

.lista-topo{
    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:16px;

    border-bottom:1px solid #303030;
}

.lista-topo h2{
    font-size:17px;
}

.lista-topo span{
    color:#888;
    font-size:12px;
}

.movimento-item{

    padding:15px;

    border-bottom:1px solid #292929;

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:12px;
}

.movimento-item:last-child{
    border-bottom:none;
}

.movimento-info{
    min-width:0;
}

.produto{
    font-weight:bold;
    font-size:15px;

    margin-bottom:5px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.detalhes{
    color:#888;
    font-size:12px;

    line-height:1.5;
}

.movimento-direita{
    text-align:right;
    flex-shrink:0;
}

.tipo{
    display:inline-block;

    padding:5px 8px;

    border-radius:8px;

    font-size:10px;

    font-weight:bold;

    margin-bottom:5px;
}

.tipo-entrada{
    color:#72e58a;
    background:rgba(53,199,89,.12);
}

.tipo-saida{
    color:#ff7777;
    background:rgba(255,77,77,.12);
}

.quantidade{
    font-size:17px;
    font-weight:900;
}

.data{
    color:#777;
    font-size:10px;
    margin-top:3px;
}


/* =========================
   VAZIO
========================= */

.vazio{
    text-align:center;

    padding:35px 20px;

    color:#777;
}

.vazio .icone{
    font-size:35px;
    margin-bottom:10px;
}

.vazio strong{
    display:block;

    color:#aaa;

    margin-bottom:5px;
}


/* =========================
   RESPONSIVO
========================= */

@media(max-width:700px){

    .grid-filtros{
        grid-template-columns:1fr 1fr;
    }

    .campo:first-child{
        grid-column:1 / -1;
    }

}

@media(max-width:500px){

    body{
        padding:12px;
    }

    .titulo-area h1{
        font-size:20px;
    }

    .metricas{
        gap:7px;
    }

    .metrica{
        padding:12px 6px;
        border-radius:13px;
    }

    .metrica-numero{
        font-size:20px;
    }

    .grid-filtros{
        grid-template-columns:1fr;
    }

    .campo:first-child{
        grid-column:auto;
    }

    .movimento-item{
        align-items:flex-start;
    }

}

</style>

</head>

<body>

<div class="container">


<!-- =========================
     TOPO
========================= -->

<header class="topo">

    <button
        class="btn-voltar"
        type="button"
        onclick="voltar()"
    >
        ←
    </button>

    <div class="titulo-area">

        <h1>
            Histórico de Estoque
        </h1>

        <p>
            Movimentações de produtos e mercadorias
        </p>

    </div>

</header>


<!-- =========================
     MÉTRICAS
========================= -->

<section class="metricas">

    <div class="metrica">

        <div class="metrica-label">
            Entradas
        </div>

        <div
            class="metrica-numero entrada"
            id="totalEntradas"
        >
            0
        </div>

    </div>


    <div class="metrica">

        <div class="metrica-label">
            Saídas
        </div>

        <div
            class="metrica-numero saida"
            id="totalSaidas"
        >
            0
        </div>

    </div>


    <div class="metrica">

        <div class="metrica-label">
            Movimentos
        </div>

        <div
            class="metrica-numero movimento"
            id="totalMovimentos"
        >
            0
        </div>

    </div>

</section>


<!-- =========================
     FILTROS
========================= -->

<section class="filtros">

    <div class="filtros-titulo">
        🔍 Filtrar movimentações
    </div>


    <div class="grid-filtros">


        <div class="campo">

            <label>
                Produto
            </label>

            <input
                type="text"
                id="filtroProduto"
                placeholder="Digite o produto..."
            >

        </div>


        <div class="campo">

            <label>
                Tipo
            </label>

            <select id="filtroTipo">

                <option value="">
                    Todos
                </option>

                <option value="entrada">
                    Entrada
                </option>

                <option value="saida">
                    Saída
                </option>

            </select>

        </div>


        <div class="campo">

            <label>
                Data inicial
            </label>

            <input
                type="date"
                id="dataInicial"
            >

        </div>


        <div class="campo">

            <label>
                Data final
            </label>

            <input
                type="date"
                id="dataFinal"
            >

        </div>

    </div>


    <div class="acoes">

        <button
            class="btn btn-filtrar"
            type="button"
            onclick="aplicarFiltros()"
        >
            🔍 Filtrar
        </button>

        <button
            class="btn btn-limpar"
            type="button"
            onclick="limparFiltros()"
        >
            Limpar
        </button>

    </div>

</section>


<!-- =========================
     LISTA
========================= -->

<section class="lista">

    <div class="lista-topo">

        <h2>
            📋 Movimentações
        </h2>

        <span id="contador">
            0 registros
        </span>

    </div>


    <div id="listaMovimentos">

    </div>

</section>


</div>


<script>

/* =========================
   STORAGE
========================= */

function lerHistorico(){

    try{

        const dados =
            localStorage.getItem(
                "historicoEstoque"
            );

        if(!dados){
            return [];
        }

        const convertido =
            JSON.parse(dados);

        return Array.isArray(convertido)
            ? convertido
            : [];

    }catch(erro){

        console.log(
            "Erro no histórico:",
            erro
        );

        return [];

    }

}


/* =========================
   NÚMERO
========================= */

function numero(valor){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){
        return 0;
    }

    if(typeof valor === "number"){
        return isNaN(valor) ? 0 : valor;
    }

    let texto =
        String(valor)
        .replace(/[R$\s]/g,"");

    if(
        texto.includes(".") &&
        texto.includes(",")
    ){

        texto =
            texto
            .replace(/\./g,"")
            .replace(",", ".");

    }else if(texto.includes(",")){

        texto =
            texto.replace(",", ".");

    }

    const valorFinal =
        parseFloat(texto);

    return isNaN(valorFinal)
        ? 0
        : valorFinal;

}


/* =========================
   NORMALIZAR TIPO
========================= */

function normalizarTipo(item){

    const tipo =
        String(
            item.tipo ??
            item.movimento ??
            item.operacao ??
            ""
        )
        .toLowerCase()
        .trim();

    if(
        tipo.includes("entrada") ||
        tipo.includes("entrada")
    ){
        return "entrada";
    }

    if(
        tipo.includes("saida") ||
        tipo.includes("saída") ||
        tipo.includes("venda") ||
        tipo.includes("baixa")
    ){
        return "saida";
    }

    return tipo;

}


/* =========================
   NOME PRODUTO
========================= */

function nomeProduto(item){

    return String(

        item.produto ??
        item.nomeProduto ??
        item.nome ??
        item.mercadoria ??
        "Produto não informado"

    );

}


/* =========================
   QUANTIDADE
========================= */

function quantidadeMovimento(item){

    return numero(

        item.quantidade ??
        item.qtd ??
        item.quantidadeMovimentada ??
        item.estoque ??
        0

    );

}


/* =========================
   DATA
========================= */

function dataMovimento(item){

    return (

        item.data ??
        item.dataMovimento ??
        item.created_at ??
        item.criadoEm ??
        item.timestamp ??
        ""

    );

}


/* =========================
   FORMATAR DATA
========================= */

function formatarData(data){

    if(!data){
        return "--";
    }

    const d =
        new Date(data);

    if(isNaN(d.getTime())){
        return String(data);
    }

    return d.toLocaleDateString(
        "pt-BR"
    );

}


/* =========================
   DATA PARA FILTRO
========================= */

function dataISO(data){

    if(!data){
        return "";
    }

    const d =
        new Date(data);

    if(isNaN(d.getTime())){
        return "";
    }

    return d.toISOString()
        .split("T")[0];

}


/* =========================
   RENDERIZAR
========================= */

function renderizar(lista){

    const area =
        document.getElementById(
            "listaMovimentos"
        );

    const contador =
        document.getElementById(
            "contador"
        );


    contador.textContent =
        lista.length +
        (
            lista.length === 1
                ? " registro"
                : " registros"
        );


    if(lista.length === 0){

        area.innerHTML = `

            <div class="vazio">

                <div class="icone">
                    📦
                </div>

                <strong>
                    Nenhuma movimentação encontrada
                </strong>

                <span>
                    As entradas e saídas do estoque aparecerão aqui.
                </span>

            </div>

        `;

        return;

    }


    area.innerHTML = "";


    lista.forEach(
        function(item){

            const tipo =
                normalizarTipo(item);

            const nome =
                nomeProduto(item);

            const quantidade =
                quantidadeMovimento(item);

            const data =
                dataMovimento(item);


            const tipoTexto =
                tipo === "entrada"
                    ? "ENTRADA"
                    : tipo === "saida"
                        ? "SAÍDA"
                        : String(
                            tipo || "MOVIMENTO"
                        ).toUpperCase();


            const classe =
                tipo === "entrada"
                    ? "tipo-entrada"
                    : "tipo-saida";


            const sinal =
                tipo === "entrada"
                    ? "+"
                    : tipo === "saida"
                        ? "-"
                        : "";


            const unidade =
                item.unidade ??
                item.unidadeMedida ??
                "";


            const fornecedor =
                item.fornecedor ??
                "";


            const detalhes = [

                formatarData(data),

                fornecedor
                    ? "Fornecedor: " + fornecedor
                    : "",

                unidade
                    ? "Unidade: " + unidade
                    : ""

            ]
            .filter(Boolean)
            .join(" • ");


            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "movimento-item";


            div.innerHTML = `

                <div class="movimento-info">

                    <div class="produto">
                        ${escapar(nome)}
                    </div>

                    <div class="detalhes">
                        ${escapar(detalhes)}
                    </div>

                </div>


                <div class="movimento-direita">

                    <div class="tipo ${classe}">
                        ${tipoTexto}
                    </div>

                    <div class="quantidade">
                        ${sinal}${quantidade}
                        ${escapar(unidade)}
                    </div>

                    <div class="data">
                        ${formatarData(data)}
                    </div>

                </div>

            `;


            area.appendChild(div);

        }
    );

}


/* =========================
   ESCAPAR HTML
========================= */

function escapar(valor){

    return String(valor)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   FILTRAR
========================= */

function aplicarFiltros(){

    const produto =
        document.getElementById(
            "filtroProduto"
        )
        .value
        .toLowerCase()
        .trim();


    const tipo =
        document.getElementById(
            "filtroTipo"
        ).value;


    const inicial =
        document.getElementById(
            "dataInicial"
        ).value;


    const final =
        document.getElementById(
            "dataFinal"
        ).value;


    const historico =
        lerHistorico();


    const filtrado =
        historico.filter(
            function(item){

                const nome =
                    nomeProduto(item)
                    .toLowerCase();


                const tipoItem =
                    normalizarTipo(item);


                const data =
                    dataISO(
                        dataMovimento(item)
                    );


                if(
                    produto &&
                    !nome.includes(produto)
                ){
                    return false;
                }


                if(
                    tipo &&
                    tipoItem !== tipo
                ){
                    return false;
                }


                if(
                    inicial &&
                    data &&
                    data < inicial
                ){
                    return false;
                }


                if(
                    final &&
                    data &&
                    data > final
                ){
                    return false;
                }


                return true;

            }
        );


    renderizar(
        ordenar(filtrado)
    );

}


/* =========================
   ORDENAR
========================= */

function ordenar(lista){

    return [...lista].sort(
        function(a,b){

            const dataA =
                new Date(
                    dataMovimento(a)
                ).getTime() || 0;


            const dataB =
                new Date(
                    dataMovimento(b)
                ).getTime() || 0;


            return dataB - dataA;

        }
    );

}


/* =========================
   MÉTRICAS
========================= */

function atualizarMetricas(){

    const historico =
        lerHistorico();


    let entradas = 0;
    let saidas = 0;


    historico.forEach(
        function(item){

            const tipo =
                normalizarTipo(item);


            if(tipo === "entrada"){

                entradas++;

            }else if(tipo === "saida"){

                saidas++;

            }

        }
    );


    document.getElementById(
        "totalEntradas"
    ).textContent =
        entradas;


    document.getElementById(
        "totalSaidas"
    ).textContent =
        saidas;


    document.getElementById(
        "totalMovimentos"
    ).textContent =
        historico.length;

}


/* =========================
   LIMPAR
========================= */

function limparFiltros(){

    document.getElementById(
        "filtroProduto"
    ).value = "";


    document.getElementById(
        "filtroTipo"
    ).value = "";


    document.getElementById(
        "dataInicial"
    ).value = "";


    document.getElementById(
        "dataFinal"
    ).value = "";


    iniciar();

}


/* =========================
   VOLTAR
========================= */

function voltar(){

    window.location.href =
        "index.html";

}


/* =========================
   INICIAR
========================= */

function iniciar(){

    const historico =
        lerHistorico();


    atualizarMetricas();

    renderizar(
        ordenar(historico)
    );

}


iniciar();


/* =========================
   ATUALIZAR AO VOLTAR
========================= */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.visibilityState ===
            "visible"
        ){

            iniciar();

        }

    }
);

</script>

</body>
    </html>
