<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>GrillCore ERP - Produtos</title>

<link rel="stylesheet" href="style.css">

<style>

body {
    padding: 15px;
}

.container {
    max-width: 650px;
    margin: 0 auto;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 16px;
    margin-bottom: 7px;
    font-weight: bold;
}

input,
select,
textarea {

    width: 100%;

    padding: 13px;

    border-radius: 10px;

    border: 1px solid #444;

    background: #222;

    color: white;

    font-size: 16px;

}

textarea {
    resize: vertical;
}

button {

    width: 100%;

    padding: 15px;

    margin-top: 18px;

    border: none;

    border-radius: 10px;

    font-size: 16px;

    font-weight: bold;

}

.lista-produto {

    background: #191919;

    border: 1px solid #333;

    border-radius: 14px;

    padding: 16px;

    margin-top: 15px;

}

.lista-produto h3 {

    margin-top: 0;

    color: #f4d76b;

}

.categoria-produto {

    display: inline-block;

    padding: 5px 9px;

    border-radius: 20px;

    background: #333;

    color: #f4d76b;

    font-size: 12px;

    margin-bottom: 8px;

}

.produto-foto {

    width: 100%;

    max-height: 220px;

    object-fit: cover;

    border-radius: 10px;

    margin-top: 10px;

}

.btn-excluir {

    background: #750000;

    color: white;

}

.btn-editar {

    background: #444;

    color: white;

}

.info-categoria {

    margin-top: 10px;

    padding: 12px;

    background: #101010;

    border: 1px solid #333;

    border-radius: 10px;

    color: #aaa;

    line-height: 1.6;

    font-size: 14px;

}

</style>

</head>


<body>

<div class="container">


<h1>
    🍔 GrillCore ERP
</h1>

<h2>
    📦 Cadastro de Produtos
</h2>


<!-- =========================================
     NOME
========================================= -->

<label for="nomeProduto">
    Nome do produto
</label>

<input
    type="text"
    id="nomeProduto"
    placeholder="Ex: X Prensado">


<!-- =========================================
     CATEGORIA
========================================= -->

<label for="categoriaProduto">
    Categoria do produto
</label>

<select id="categoriaProduto">

    <option value="">
        Selecione a categoria
    </option>

    <option value="hamburguer">
        🍔 Hambúrguer
    </option>

    <option value="porcao">
        🍟 Porção
    </option>

    <option value="bebida">
        🥤 Bebida
    </option>

</select>


<div class="info-categoria">

    💡 <strong>Importante:</strong>

    <br>

    🍔 Hambúrguer → aparece em Hambúrguer no Novo Pedido.

    <br>

    🍟 Porção → aparece em Porção no Novo Pedido.

    <br>

    🥤 Bebida → aparece em Bebida no Novo Pedido.

</div>


<!-- =========================================
     PREÇO
========================================= -->

<label for="precoProduto">
    💰 Preço
</label>

<input
    type="number"
    id="precoProduto"
    min="0"
    step="0.01"
    placeholder="Ex: 30.00">


<!-- =========================================
     ESTOQUE
========================================= -->

<label for="estoqueProduto">
    📦 Quantidade em estoque
</label>

<input
    type="number"
    id="estoqueProduto"
    min="0"
    value="0">


<!-- =========================================
     FOTO
========================================= -->

<label for="fotoProduto">
    📷 Foto do produto
</label>

<input
    type="file"
    id="fotoProduto"
    accept="image/*">


<!-- =========================================
     INGREDIENTES
========================================= -->

<label for="ingredientes">
    🥬 Ingredientes
</label>

<textarea
    id="ingredientes"
    rows="5"
    placeholder="Ex: pão, hambúrguer 180g, queijo, bacon..."></textarea>


<!-- =========================================
     DESCRIÇÃO
========================================= -->

<label for="descricao">
    📝 Descrição
</label>

<textarea
    id="descricao"
    rows="4"
    placeholder="Descrição do produto"></textarea>


<!-- =========================================
     BOTÃO
========================================= -->

<button
    onclick="salvarProduto()">

    💾 SALVAR PRODUTO

</button>


<h2>
    📋 Produtos Cadastrados
</h2>


<div id="listaProdutos">

</div>


<br>


<a href="index.html">

    <button class="voltar">

        ← Voltar ao início

    </button>

</a>


</div>


<script src="script.js"></script>


<script>

/* =========================================
   CARREGAR PRODUTOS AO ABRIR
========================================= */

window.addEventListener(
    "load",
    function() {

        if (
            typeof carregarProdutos ===
            "function"
        ) {

            carregarProdutos();

        }

        else if (
            typeof atualizarListaProdutos ===
            "function"
        ) {

            atualizarListaProdutos();

        }

    }
);

</script>


</body>

          </html>
