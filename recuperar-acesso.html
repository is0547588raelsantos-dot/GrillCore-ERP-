<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<link rel="stylesheet" href="tema-laranja.css">
<title>GrillCore ERP — Redefinir senha</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;width:100%}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;font-family:Arial,Helvetica,sans-serif;color:#fff;background:radial-gradient(circle at top,#351300 0%,#180900 30%,#080808 72%)}
.container{width:100%;max-width:440px;margin:auto}
.brand{text-align:center;margin-bottom:24px}
.logo{width:76px;height:76px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;border-radius:22px;background:linear-gradient(145deg,#ff7300,#b94700);border:1px solid #ff9a3d;font-size:42px;box-shadow:0 12px 35px #0009,0 0 28px #ff730033}
.brand h1{font-size:36px;line-height:1;font-weight:800}.brand h1 span{color:#ff8a1f}
.brand p{margin-top:9px;color:#888;font-size:12px}
.panel{padding:28px 24px;background:linear-gradient(145deg,#1b0f08fa,#0a0a0afa);border:1px solid #ff730061;border-radius:24px;box-shadow:0 25px 60px #000a,inset 0 1px #ffffff0a}
.icon{width:58px;height:58px;margin-bottom:18px;display:flex;align-items:center;justify-content:center;border-radius:17px;background:#ff730018;border:1px solid #ff73004d;font-size:25px}
h2{color:#ff9a3d;font-size:23px;margin-bottom:9px}
.desc{color:#aaa;font-size:13px;line-height:1.65;margin-bottom:22px}
.group{margin-bottom:17px}label{display:block;margin-bottom:7px;color:#ddd;font-size:14px;font-weight:bold}
.wrap{position:relative}input{width:100%;min-height:52px;padding:14px 52px 14px 14px;border-radius:12px;border:1px solid #49301b;background:#0b0b0b;color:#fff;font-size:16px;outline:none}
input:focus{border-color:#ff7300;box-shadow:0 0 0 2px #ff73001f}input::placeholder{color:#777}
.eye{position:absolute;right:5px;top:5px;width:42px;height:42px;border:0;border-radius:9px;background:transparent;color:#ff8a1f;font-size:18px;cursor:pointer}
.message{display:none;padding:13px;margin:0 0 17px;border-radius:11px;text-align:center;font-size:13px;line-height:1.5}
.message.error{background:#3d1208;border:1px solid #9d3515;color:#ff9a7a}
.message.ok{background:#0b2c1b;border:1px solid #247849;color:#8bf0b4}
.message.info{display:block;background:#241507;border:1px solid #7a3c12;color:#ffbd83}
.btn{width:100%;min-height:53px;border:0;border-radius:13px;background:linear-gradient(145deg,#ff8a1f,#d95700);color:#120900;font-weight:900;font-size:14px;letter-spacing:.4px;cursor:pointer}
.btn:disabled{opacity:.65;cursor:wait}
.back{display:block;margin-top:18px;text-align:center;color:#ff9a3d;text-decoration:none;font-size:13px}
.foot{text-align:center;margin-top:20px;color:#666;font-size:11px;line-height:1.6}.foot strong{color:#ff8a1f}
@media(max-width:480px){body{padding:14px}.panel{padding:25px 18px;border-radius:21px}.brand h1{font-size:34px}}
</style>
</head>
<body>
<div class="container">
  <div class="brand">
    <div class="logo">🍔</div>
    <h1>Grill<span>Core</span></h1>
    <p>ERP • Gestão inteligente para hamburguerias</p>
  </div>
  <main class="panel">
    <div class="icon">🔐</div>
    <h2>Redefinir senha</h2>
    <p class="desc">Crie uma nova senha segura para sua conta GrillCore. Esta alteração será feita diretamente no Supabase.</p>
    <div class="group">
      <label for="nova">Nova senha</label>
      <div class="wrap"><input id="nova" type="password" autocomplete="new-password" placeholder="Digite uma senha (mínimo 8 caracteres)"><button class="eye" type="button" onclick="toggle('nova',this)" aria-label="Mostrar senha">👁️</button></div>
    </div>
    <div class="group">
      <label for="confirmar">Confirmar nova senha</label>
      <div class="wrap"><input id="confirmar" type="password" autocomplete="new-password" placeholder="Digite a senha novamente"><button class="eye" type="button" onclick="toggle('confirmar',this)" aria-label="Mostrar senha">👁️</button></div>
    </div>
    <div id="msg" class="message" role="status" aria-live="polite"></div>
    <button id="salvar" class="btn" type="button" onclick="redefinirSenha()">🔐 SALVAR NOVA SENHA</button>
    <a class="back" href="login.html">← Voltar para o login</a>
  </main>
  <div class="foot"><strong>GrillCore ERP</strong><br>Sistema profissional de gestão</div>
</div>
<script>
"use strict";
const SUPABASE_URL = "https://vtdfdqtjcyqbtfskwnun.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_HZB_Bu780JSCXWLzb7pRoA_aKNwmfls";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});
let recuperacaoConfirmada = false;
let verificacaoConcluida = false;

function toggle(id,button){
  const input=document.getElementById(id);
  input.type=input.type==="password"?"text":"password";
  button.textContent=input.type==="password"?"👁️":"😎";
  button.setAttribute("aria-label",input.type==="password"?"Mostrar senha":"Ocultar senha");
}
function showMessage(text,type){
  const box=document.getElementById("msg");
  box.className="message "+type;
  box.textContent=text;
  box.style.display="block";
}

// O Supabase sinaliza quando o link de recuperação é reconhecido.
supabaseClient.auth.onAuthStateChange((event, session)=>{
  if(event==="PASSWORD_RECOVERY" && session){
    recuperacaoConfirmada=true;
    verificacaoConcluida=true;
    showMessage("Link de recuperação validado. Você já pode criar sua nova senha.","info");
  }
  if(event==="SIGNED_IN" && session && !verificacaoConcluida){
    // Também permite o fluxo por sessão/código PKCE quando o Supabase já restaurou a sessão.
    verificacaoConcluida=true;
  }
});

async function validarSessaoRecuperacao(){
  // Aguarda a leitura da sessão restaurada pelo Supabase após abrir o link.
  const {data,error}=await supabaseClient.auth.getSession();
  if(error) throw error;
  if(data.session){
    verificacaoConcluida=true;
    return true;
  }
  return recuperacaoConfirmada;
}

async function redefinirSenha(){
  const senha=document.getElementById("nova").value;
  const confirmacao=document.getElementById("confirmar").value;
  const button=document.getElementById("salvar");
  document.getElementById("msg").style.display="none";
  if(senha.length<8){showMessage("A senha deve ter pelo menos 8 caracteres.","error");return;}
  if(senha!==confirmacao){showMessage("As senhas não coincidem. Confira e tente novamente.","error");return;}
  button.disabled=true;button.textContent="SALVANDO...";
  try{
    const sessaoValida=await validarSessaoRecuperacao();
    if(!sessaoValida) throw new Error("O link de recuperação expirou ou não foi validado. Solicite um novo e-mail de recuperação e abra o link mais recente.");
    const {error:updateError}=await supabaseClient.auth.updateUser({password:senha});
    if(updateError) throw updateError;
    showMessage("Senha atualizada com sucesso! Você será redirecionado ao login.","ok");
    button.textContent="✅ SENHA ALTERADA";
    setTimeout(async()=>{
      await supabaseClient.auth.signOut();
      window.location.replace("login.html");
    },1800);
  }catch(error){
    console.error("GrillCore redefinição:",error);
    showMessage(error.message||"Não foi possível atualizar a senha. Solicite um novo link de recuperação.","error");
    button.disabled=false;button.textContent="🔐 SALVAR NOVA SENHA";
  }
}
document.addEventListener("keydown",e=>{if(e.key==="Enter")redefinirSenha();});
</script>
</body>
</html>
