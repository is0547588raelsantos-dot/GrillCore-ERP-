<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#080808">

<link rel="stylesheet"
      href="tema-laranja.css">

<meta name="apple-mobile-web-app-capable"
      content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent">

<title>GrillCore ERP — Acesso</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#fff;

    background:
        radial-gradient(
            circle at top,
            #351300 0%,
            #180900 30%,
            #080808 72%
        );
}

.login-container{

    width:100%;
    max-width:430px;

    margin:auto;
}

.logo-area{

    text-align:center;

    margin-bottom:24px;
}

.logo-icon{

    width:78px;
    height:78px;

    margin:0 auto 10px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            #ff7300,
            #b94700
        );

    border:1px solid #ff9a3d;

    font-size:44px;

    box-shadow:
        0 12px 35px rgba(0,0,0,.55),
        0 0 28px rgba(255,115,0,.20);
}

.logo-area h1{

    font-size:38px;

    line-height:1;

    color:#ff8a1f;

    letter-spacing:1px;

    text-shadow:
        0 2px 12px rgba(0,0,0,.7);
}

.logo-area h2{

    margin-top:8px;

    color:#fff;

    font-size:13px;

    font-weight:bold;

    letter-spacing:3px;

    opacity:.9;
}

.login-card{

    width:100%;

    padding:28px 24px;

    background:
        linear-gradient(
            145deg,
            rgba(27,15,8,.98),
            rgba(10,10,10,.98)
        );

    border:1px solid rgba(255,115,0,.38);

    border-radius:24px;

    box-shadow:
        0 25px 60px rgba(0,0,0,.65),
        0 0 30px rgba(255,115,0,.05),
        inset 0 1px 0 rgba(255,255,255,.05);
}

.login-title{

    text-align:center;

    margin-bottom:25px;

    color:#ff9a3d;

    font-size:22px;

    font-weight:bold;
}

.form-group{

    margin-bottom:17px;
}

label{

    display:block;

    margin-bottom:7px;

    color:#ddd;

    font-size:14px;

    font-weight:bold;
}

.input-wrapper{

    position:relative;
}

input{

    width:100%;

    min-height:52px;

    padding:15px;

    border-radius:12px;

    border:1px solid #49301b;

    background:#0b0b0b;

    color:#fff;

    font-size:16px;

    outline:none;

    transition:
        border-color .2s,
        box-shadow .2s;
}

input:focus{

    border-color:#ff7300;

    box-shadow:
        0 0 0 2px rgba(255,115,0,.12);
}

input::placeholder{

    color:#777;
}

#senha{

    padding-right:52px;
}

.btn-senha{

    position:absolute;

    right:5px;
    top:5px;

    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border:none;

    border-radius:9px;

    background:transparent;

    color:#ff8a1f;

    font-size:19px;

    cursor:pointer;
}

.btn-senha:hover{

    background:#241207;
}

.opcoes-login{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    margin-top:-5px;

    margin-bottom:16px;
}

.checkbox-area{

    display:flex;

    align-items:center;

    gap:8px;

    color:#aaa;

    font-size:13px;

    cursor:pointer;
}

.checkbox-area input{

    width:17px;
    height:17px;

    min-height:auto;

    padding:0;

    accent-color:#ff7300;

    cursor:pointer;
}

.status-login{

    display:none;

    margin-bottom:15px;

    padding:11px;

    border-radius:10px;

    text-align:center;

    background:#16100b;

    border:1px solid rgba(255,115,0,.25);

    color:#ffb56f;

    font-size:13px;
}

.btn-entrar{

    width:100%;

    min-height:54px;

    margin-top:7px;

    border:none;

    border-radius:13px;

    background:
        linear-gradient(
            145deg,
            #ff8a1f,
            #d95700
        );

    color:#120900;

    font-size:16px;

    font-weight:900;

    letter-spacing:.4px;

    cursor:pointer;

    box-shadow:
        0 8px 20px rgba(0,0,0,.4);

    transition:
        transform .15s,
        opacity .2s;
}

.btn-entrar:active{

    transform:scale(.98);
}

.btn-entrar:disabled{

    opacity:.7;

    cursor:wait;
}

.erro{

    display:none;

    margin-top:15px;

    padding:13px;

    border-radius:10px;

    text-align:center;

    background:#3d1208;

    border:1px solid #9d3515;

    color:#ff9a7a;

    font-size:14px;

    line-height:1.4;
}

.acoes-login{

    display:flex;

    justify-content:center;

    gap:18px;

    margin-top:20px;
}

.acoes-login button{

    width:auto;

    margin:0;

    padding:5px;

    border:none;

    background:transparent;

    color:#ff9a3d;

    font-size:13px;

    cursor:pointer;
}

.acoes-login button:hover{

    color:#ffb56f;

    text-decoration:underline;
}

.divisor{

    height:1px;

    margin:23px 0 18px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,115,0,.35),
            transparent
        );
}

.admin-info{

    text-align:center;

    color:#777;

    font-size:12px;

    line-height:1.5;
}

.admin-info strong{

    color:#ff8a1f;
}

.ultimo-acesso{

    display:none;

    margin-top:13px;

    text-align:center;

    color:#777;

    font-size:11px;

    line-height:1.5;
}

.info{

    text-align:center;

    margin-top:20px;

    color:#777;

    font-size:11px;
}

.info span{

    color:#ff7300;
}

@media(max-width:480px){

    body{
        padding:15px;
    }

    .login-card{
        padding:25px 18px;
        border-radius:20px;
    }

    .logo-area h1{
        font-size:34px;
    }

}

@media(max-width:350px){

    .acoes-login{

        flex-direction:column;

        gap:7px;

    }

    .opcoes-login{

        align-items:flex-start;

        flex-direction:column;

    }

}

</style>

</head>

<body>

<div class="login-container">

    <div class="logo-area">

        <div class="logo-icon">
            🍔
        </div>

        <h1>
            GrillCore
        </h1>

        <h2>
            ERP • HAMBÚRGUERIA
        </h2>

    </div>


    <div class="login-card">

        <div class="login-title">
            🔐 Acesso ao Sistema
        </div>


        <div class="form-group">

            <label for="usuario">
                👤 Usuário
            </label>

            <input
                id="usuario"
                type="text"
                placeholder="Digite seu usuário"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false">

        </div>


        <div class="form-group">

            <label for="senha">
                🔑 Senha
            </label>

            <div class="input-wrapper">

                <input
                    id="senha"
                    type="password"
                    placeholder="Digite sua senha"
                    autocomplete="current-password">

                <button
                    type="button"
                    class="btn-senha"
                    id="btnMostrarSenha"
                    onclick="alternarSenha()"
                    aria-label="Mostrar senha">

                    👁️

                </button>

            </div>

        </div>


        <div class="opcoes-login">

            <label class="checkbox-area">

                <input
                    type="checkbox"
                    id="lembrarUsuario">

                <span>
                    Lembrar usuário
                </span>

            </label>

        </div>


        <div
            id="statusLogin"
            class="status-login">

            ⏳ Verificando acesso...

        </div>


        <button
            type="button"
            class="btn-entrar"
            id="btnEntrar"
            onclick="entrar()">

            🔓 ENTRAR NO GRILLCORE

        </button>


        <div
            id="erro"
            class="erro"
            role="alert">

            ❌ Usuário ou senha incorretos.

        </div>


        <div class="acoes-login">

            <button
                type="button"
                onclick="recuperarAcesso()">

                🔑 Esqueci minha senha

            </button>


            <button
                type="button"
                onclick="falarComAdministrador()">

                💬 Falar com administrador

            </button>

        </div>


        <div class="divisor"></div>


        <div class="admin-info">

            🔒 <strong>Acesso protegido</strong><br>

            Entre com suas credenciais para acessar
            o painel de gestão.

        </div>


        <div
            id="ultimoAcesso"
            class="ultimo-acesso">

        </div>

    </div>


    <div class="info">

        GrillCore ERP • Gestão profissional<br>

        <span>© 2026 GrillCore</span>

    </div>

</div>


<script>

/* =====================================================
   GRILLCORE ERP
   LOGIN — VERSÃO CORRIGIDA
===================================================== */


/* =====================================================
   CHAVES
===================================================== */

const CHAVE_USUARIOS =
    "grillcore_usuarios";

const CHAVE_USUARIO_ANTIGA =
    "grillcore_usuario_login";

const CHAVE_SENHA_ANTIGA =
    "grillcore_senha_login";

const CHAVE_LEMBRAR =
    "grillcore_lembrar_usuario";

const CHAVE_ULTIMO_ACESSO =
    "grillcore_ultimo_acesso";

const CHAVE_HISTORICO =
    "grillcore_historico_acessos";

const CHAVE_TENTATIVAS =
    "grillcore_tentativas_login";

const CHAVE_BLOQUEIO =
    "grillcore_bloqueio_login";


/* =====================================================
   CONFIGURAÇÕES
===================================================== */

const MAX_TENTATIVAS = 5;

const TEMPO_BLOQUEIO = 60 * 1000;


/* =====================================================
   INICIALIZAR SISTEMA
===================================================== */

function inicializarUsuarios(){

    let usuarios = [];

    try{

        const salvo =
            localStorage.getItem(
                CHAVE_USUARIOS
            );

        if(salvo){

            usuarios = JSON.parse(salvo);

        }

    }
    catch(e){

        usuarios = [];

    }


    if(!Array.isArray(usuarios)){

        usuarios = [];

    }


    /*
       -------------------------------------------------
       MIGRAÇÃO DO LOGIN ANTIGO
       -------------------------------------------------

       Se existia um usuário antigo, tentamos
       aproveitá-lo sem apagar nada.
    */

    const usuarioAntigo =
        localStorage.getItem(
            CHAVE_USUARIO_ANTIGA
        );

    const senhaAntiga =
        localStorage.getItem(
            CHAVE_SENHA_ANTIGA
        );


    if(
        usuarioAntigo &&
        senhaAntiga
    ){

        const existeAntigo =
            usuarios.some(
                function(item){

                    if(!item){
                        return false;
                    }

                    return String(
                        item.usuario || ""
                    )
                    .trim()
                    .toLowerCase()
                    ===
                    String(
                        usuarioAntigo
                    )
                    .trim()
                    .toLowerCase();

                }
            );


        if(!existeAntigo){

            usuarios.push({

                id:
                    "migrado-" +
                    Date.now(),

                usuario:
                    usuarioAntigo,

                senha:
                    senhaAntiga,

                nome:
                    usuarioAntigo,

                tipo:
                    "usuario",

                ativo:
                    true

            });

        }

    }


    /*
       -------------------------------------------------
       ADMIN PADRÃO
       -------------------------------------------------

       Só cria admin / 1234 se NÃO existir admin.

       Se já existir, sua senha permanece intacta.
    */

    const indiceAdmin =
        usuarios.findIndex(
            function(item){

                return (
                    item &&
                    String(
                        item.usuario || ""
                    )
                    .trim()
                    .toLowerCase()
                    ===
                    "admin"
                );

            }
        );


    if(indiceAdmin === -1){

        usuarios.push({

            id:
                "admin-" +
                Date.now(),

            usuario:
                "admin",

            senha:
                "1234",

            nome:
                "Administrador",

            tipo:
                "admin",

            ativo:
                true

        });

    }
    else{

        usuarios[indiceAdmin].nome =
            usuarios[indiceAdmin].nome ||
            "Administrador";

        usuarios[indiceAdmin].tipo =
            usuarios[indiceAdmin].tipo ||
            "admin";

        if(
            typeof usuarios[indiceAdmin].ativo
            ===
            "undefined"
        ){

            usuarios[indiceAdmin].ativo =
                true;

        }

    }


    /*
       Salva somente a estrutura atualizada.
       Não apaga usuários existentes.
    */

    try{

        localStorage.setItem(
            CHAVE_USUARIOS,
            JSON.stringify(
                usuarios
            )
        );

    }
    catch(e){

        console.error(
            "Erro ao salvar usuários:",
            e
        );

    }

}


/* =====================================================
   OBTER USUÁRIOS
===================================================== */

function obterUsuarios(){

    try{

        const dados =
            localStorage.getItem(
                CHAVE_USUARIOS
            );


        if(!dados){

            inicializarUsuarios();

            return obterUsuarios();

        }


        const usuarios =
            JSON.parse(
                dados
            );


        if(!Array.isArray(usuarios)){

            inicializarUsuarios();

            return obterUsuarios();

        }


        return usuarios;

    }
    catch(e){

        console.error(
            "Erro ao obter usuários:",
            e
        );

        return [];

    }

}


/* =====================================================
   MOSTRAR / OCULTAR SENHA
===================================================== */

function alternarSenha(){

    const campo =
        document.getElementById(
            "senha"
        );

    const botao =
        document.getElementById(
            "btnMostrarSenha"
        );


    if(
        campo.type ===
        "password"
    ){

        campo.type =
            "text";

        botao.textContent =
            "😎";

        botao.setAttribute(
            "aria-label",
            "Ocultar senha"
        );

    }
    else{

        campo.type =
            "password";

        botao.textContent =
            "👁️";

        botao.setAttribute(
            "aria-label",
            "Mostrar senha"
        );

    }

}


/* =====================================================
   LEMBRAR USUÁRIO
===================================================== */

function carregarUsuarioLembrado(){

    try{

        const lembrar =
            localStorage.getItem(
                CHAVE_LEMBRAR
            );

        const usuarioSalvo =
            localStorage.getItem(
                CHAVE_USUARIO_ANTIGA
            );


        if(
            lembrar === "true" &&
            usuarioSalvo
        ){

            document.getElementById(
                "usuario"
            ).value =
                usuarioSalvo;

            document.getElementById(
                "lembrarUsuario"
            ).checked =
                true;

            document.getElementById(
                "senha"
            ).focus();

        }

    }
    catch(e){

        console.warn(e);

    }

}


/* =====================================================
   SALVAR PREFERÊNCIA
===================================================== */

function salvarPreferenciaUsuario(
    usuario
){

    const lembrar =
        document.getElementById(
            "lembrarUsuario"
        ).checked;


    try{

        if(lembrar){

            localStorage.setItem(
                CHAVE_LEMBRAR,
                "true"
            );

            localStorage.setItem(
                CHAVE_USUARIO_ANTIGA,
                usuario
            );

        }
        else{

            localStorage.removeItem(
                CHAVE_LEMBRAR
            );

            localStorage.removeItem(
                CHAVE_USUARIO_ANTIGA
            );

        }

    }
    catch(e){

        console.warn(e);

    }

}


/* =====================================================
   VERIFICAR BLOQUEIO
===================================================== */

function verificarBloqueio(){

    try{

        const bloqueio =
            Number(
                localStorage.getItem(
                    CHAVE_BLOQUEIO
                )
            ) || 0;


        if(!bloqueio){

            return false;

        }


        const restante =
            bloqueio -
            Date.now();


        if(restante <= 0){

            limparTentativas();

            return false;

        }


        mostrarBloqueio(
            restante
        );

        return true;

    }
    catch(e){

        return false;

    }

}


/* =====================================================
   MOSTRAR BLOQUEIO
===================================================== */

function mostrarBloqueio(
    restante
){

    const erro =
        document.getElementById(
            "erro"
        );

    const botao =
        document.getElementById(
            "btnEntrar"
        );


    botao.disabled =
        true;


    function atualizar(){

        const bloqueio =
            Number(
                localStorage.getItem(
                    CHAVE_BLOQUEIO
                )
            ) || 0;


        const tempo =
            bloqueio -
            Date.now();


        if(tempo <= 0){

            botao.disabled =
                false;

            botao.textContent =
                "🔓 ENTRAR NO GRILLCORE";

            erro.style.display =
                "none";

            localStorage.removeItem(
                CHAVE_BLOQUEIO
            );

            localStorage.removeItem(
                CHAVE_TENTATIVAS
            );

            return;

        }


        const segundos =
            Math.ceil(
                tempo / 1000
            );


        erro.textContent =
            "🔒 Muitas tentativas incorretas. Aguarde " +
            segundos +
            " segundos.";

        erro.style.display =
            "block";

        botao.textContent =
            "🔒 AGUARDE " +
            segundos +
            "s";


        setTimeout(
            atualizar,
            1000
        );

    }


    atualizar();

}


/* =====================================================
   REGISTRAR ERRO
===================================================== */

function registrarTentativaErrada(){

    let tentativas =
        Number(
            localStorage.getItem(
                CHAVE_TENTATIVAS
            )
        ) || 0;


    tentativas++;


    localStorage.setItem(
        CHAVE_TENTATIVAS,
        String(tentativas)
    );


    if(
        tentativas >=
        MAX_TENTATIVAS
    ){

        const bloqueio =
            Date.now() +
            TEMPO_BLOQUEIO;


        localStorage.setItem(
            CHAVE_BLOQUEIO,
            String(bloqueio)
        );


        mostrarBloqueio(
            TEMPO_BLOQUEIO
        );


        return true;

    }


    return false;

}


/* =====================================================
   LIMPAR TENTATIVAS
===================================================== */

function limparTentativas(){

    localStorage.removeItem(
        CHAVE_TENTATIVAS
    );

    localStorage.removeItem(
        CHAVE_BLOQUEIO
    );

}


/* =====================================================
   REGISTRAR ACESSO
===================================================== */

function registrarAcesso(
    usuario
){

    try{

        const agora =
            new Date();


        const registro = {

            usuario:
                usuario.usuario,

            nome:
                usuario.nome ||
                usuario.usuario,

            tipo:
                usuario.tipo ||
                "usuario",

            data:
                agora.toLocaleDateString(
                    "pt-BR"
                ),

            hora:
                agora.toLocaleTimeString(
                    "pt-BR"
                ),

            timestamp:
                agora.getTime()

        };


        let historico = [];


        const salvo =
            localStorage.getItem(
                CHAVE_HISTORICO
            );


        if(salvo){

            historico =
                JSON.parse(
                    salvo
                );

        }


        if(!Array.isArray(historico)){

            historico = [];

        }


        historico.unshift(
            registro
        );


        historico =
            historico.slice(
                0,
                50
            );


        localStorage.setItem(
            CHAVE_HISTORICO,
            JSON.stringify(
                historico
            )
        );


        localStorage.setItem(
            CHAVE_ULTIMO_ACESSO,
            JSON.stringify(
                registro
            )
        );

    }
    catch(e){

        console.warn(
            "Erro ao registrar acesso:",
            e
        );

    }

}


/* =====================================================
   ÚLTIMO ACESSO
===================================================== */

function mostrarUltimoAcesso(){

    const elemento =
        document.getElementById(
            "ultimoAcesso"
        );


    try{

        const salvo =
            localStorage.getItem(
                CHAVE_ULTIMO_ACESSO
            );


        if(!salvo){

            return;

        }


        const acesso =
            JSON.parse(
                salvo
            );


        if(!acesso){

            return;

        }


        elemento.innerHTML =
            "🕐 Último acesso registrado: " +
            acesso.data +
            " às " +
            acesso.hora;


        elemento.style.display =
            "block";

    }
    catch(e){

        console.warn(e);

    }

}


/* =====================================================
   STATUS
===================================================== */

function mostrarStatus(
    mensagem
){

    const status =
        document.getElementById(
            "statusLogin"
        );


    status.textContent =
        mensagem;

    status.style.display =
        "block";

}


function esconderStatus(){

    const status =
        document.getElementById(
            "statusLogin"
        );


    status.style.display =
        "none";

}


/* =====================================================
   ENTRAR
===================================================== */

function entrar(){

    if(verificarBloqueio()){

        return;

    }


    const campoUsuario =
        document.getElementById(
            "usuario"
        );

    const campoSenha =
        document.getElementById(
            "senha"
        );

    const erro =
        document.getElementById(
            "erro"
        );

    const botao =
        document.getElementById(
            "btnEntrar"
        );


    const usuario =
        campoUsuario.value.trim();

    const senha =
        campoSenha.value;


    erro.style.display =
        "none";

    esconderStatus();


    /* -----------------------------------------------
       USUÁRIO
    ------------------------------------------------ */

    if(!usuario){

        erro.textContent =
            "⚠️ Digite seu usuário.";

        erro.style.display =
            "block";

        campoUsuario.focus();

        return;

    }


    /* -----------------------------------------------
       SENHA
    ------------------------------------------------ */

    if(!senha){

        erro.textContent =
            "⚠️ Digite sua senha.";

        erro.style.display =
            "block";

        campoSenha.focus();

        return;

    }


    /* -----------------------------------------------
       USUÁRIOS
    ------------------------------------------------ */

    const usuarios =
        obterUsuarios();


    /* -----------------------------------------------
       PROCURAR
    ------------------------------------------------ */

    const encontrado =
        usuarios.find(
            function(item){

                if(!item){

                    return false;

                }


                const usuarioBanco =
                    String(
                        item.usuario || ""
                    )
                    .trim()
                    .toLowerCase();


                const usuarioDigitado =
                    usuario
                    .trim()
                    .toLowerCase();


                const senhaBanco =
                    String(
                        item.senha || ""
                    );


                return (

                    usuarioBanco ===
                    usuarioDigitado

                    &&

                    senhaBanco ===
                    String(
                        senha
                    )

                    &&

                    item.ativo !== false

                );

            }
        );


    /* -----------------------------------------------
       LOGIN CORRETO
    ------------------------------------------------ */

    if(encontrado){

        limparTentativas();


        try{

            salvarPreferenciaUsuario(
                encontrado.usuario
            );


            localStorage.setItem(
                "grillcore_login",
                "true"
            );


            localStorage.setItem(
                "grillcore_usuario",
                encontrado.usuario
            );


            localStorage.setItem(
                "grillcore_nome_usuario",
                encontrado.nome ||
                encontrado.usuario
            );


            localStorage.setItem(
                "grillcore_tipo_usuario",
                encontrado.tipo ||
                "usuario"
            );


            localStorage.setItem(
                "grillcore_usuario_id",
                String(
                    encontrado.id || ""
                )
            );


            localStorage.setItem(
                "grillcore_sessao_inicio",
                String(
                    Date.now()
                )
            );


            registrarAcesso(
                encontrado
            );

        }
        catch(erroStorage){

            console.error(
                erroStorage
            );

            erro.textContent =
                "❌ Não foi possível salvar o acesso neste aparelho.";

            erro.style.display =
                "block";

            return;

        }


        mostrarStatus(
            "✅ Acesso autorizado. Bem-vindo, " +
            (
                encontrado.nome ||
                encontrado.usuario
            ) +
            "!"
        );


        botao.disabled =
            true;

        botao.textContent =
            "✅ ACESSANDO GRILLCORE...";


        campoSenha.value =
            "";


        setTimeout(
            function(){

                window.location.replace(
                    "index.html"
                );

            },
            500
        );


        return;

    }


    /* -----------------------------------------------
       LOGIN INCORRETO
    ------------------------------------------------ */

    const bloqueou =
        registrarTentativaErrada();


    if(bloqueou){

        return;

    }


    const tentativas =
        Number(
            localStorage.getItem(
                CHAVE_TENTATIVAS
            )
        ) || 0;


    const restantes =
        MAX_TENTATIVAS -
        tentativas;


    erro.textContent =
        "❌ Usuário ou senha incorretos.";


    if(restantes > 0){

        erro.textContent +=
            " Restam " +
            restantes +
            " tentativa(s).";

    }


    erro.style.display =
        "block";


    campoSenha.value =
        "";

    campoSenha.focus();

}

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter"
            &&
            !event.repeat
        ){

            event.preventDefault();

            entrar();

        }

    }
);

inicializarUsuarios();

carregarUsuarioLembrado();

mostrarUltimoAcesso();

verificarBloqueio();


/*
   IMPORTANTE:

   NÃO fazemos mais isto:

   if(grillcore_login === "true"){
       window.location.replace("index.html");
   }

   Assim você consegue abrir o login
   normalmente para testar ou trocar
   de usuário.

   O próprio index.html continua sendo
   responsável por impedir acesso ao
   sistema quando não houver login.
*/


/* =====================================================
   FOCO
===================================================== */

window.addEventListener(
    "load",
    function(){

        const usuario =
            document.getElementById(
                "usuario"
            );

        const senha =
            document.getElementById(
                "senha"
            );


        if(
            usuario &&
            usuario.value
        ){

            senha.focus();

        }
        else if(usuario){

            usuario.focus();

        }

    }
);
